<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>design-team avatars</title>
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body { background: #F4EFE6; display: grid; place-items: center; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const INK = '#1B1A17', PAPER = '#F4EFE6';
const ROLE = new URLSearchParams(location.search).get('role') || 'lead';

const parts = {
  // Demi - lead designer: bold composition circle + frame + slash of direction
  lead: `
    <rect x="0" y="0" width="512" height="512" fill="${PAPER}"/>
    <circle cx="212" cy="196" r="128" fill="#D43D2A"/>
    <rect x="258" y="232" width="168" height="168" rx="10" fill="none" stroke="${INK}" stroke-width="16"/>
    <rect x="96" y="330" width="220" height="30" rx="15" fill="${INK}" transform="rotate(-24 96 330)"/>
    <circle cx="356" cy="150" r="26" fill="${INK}"/>
  `,
  // Casey - critic: magnifier over a faint grid
  critic: `
    <rect x="0" y="0" width="512" height="512" fill="${PAPER}"/>
    <g fill="${INK}" opacity="0.16">
      ${Array.from({length: 6}, (_, r) => Array.from({length: 6}, (_, c) =>
        `<rect x="${86 + c * 62}" y="${86 + r * 62}" width="14" height="14" rx="3"/>`).join('')).join('')}
    </g>
    <circle cx="224" cy="224" r="112" fill="none" stroke="#6D28D9" stroke-width="30"/>
    <line x1="312" y1="312" x2="404" y2="404" stroke="#6D28D9" stroke-width="42" stroke-linecap="round"/>
    <circle cx="224" cy="224" r="30" fill="${INK}"/>
  `,
  // Ivan - implementer: chevrons + accent pixel
  implementer: `
    <rect x="0" y="0" width="512" height="512" fill="${PAPER}"/>
    <polyline points="150,150 66,256 150,362" fill="none" stroke="${INK}" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="362,150 446,256 362,362" fill="none" stroke="${INK}" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="298" y1="128" x2="214" y2="384" stroke="#0F766E" stroke-width="30" stroke-linecap="round"/>
    <rect x="232" y="404" width="48" height="48" rx="8" fill="#0F766E"/>
  `,
  // team: the trio as connected marks
  team: `
    <rect x="0" y="0" width="512" height="512" fill="${PAPER}"/>
    <line x1="256" y1="176" x2="160" y2="342" stroke="${INK}" stroke-width="10" opacity="0.5"/>
    <line x1="256" y1="176" x2="352" y2="342" stroke="${INK}" stroke-width="10" opacity="0.5"/>
    <line x1="160" y1="342" x2="352" y2="342" stroke="${INK}" stroke-width="10" opacity="0.5"/>
    <circle cx="256" cy="176" r="86" fill="#D43D2A"/>
    <circle cx="160" cy="342" r="78" fill="none" stroke="#6D28D9" stroke-width="24"/>
    <rect x="286" y="276" width="132" height="132" rx="18" fill="#0F766E"/>
    <circle cx="256" cy="176" r="24" fill="${PAPER}"/>
    <circle cx="160" cy="342" r="18" fill="${INK}"/>
    <rect x="330" y="320" width="44" height="44" rx="8" fill="${PAPER}"/>
  `,
};
document.getElementById('art').innerHTML = parts[ROLE] || parts.lead;
</script>
</body>
</html>
