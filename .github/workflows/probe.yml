# Temporary: which Node x Playwright pairs can download the browser on the hosted runner? Deleted before merging.
name: probe
on:
  push:
    branches: [ci/node-26-python-3.14]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        playwright: ['1.59.1', '1.63.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node -v
      - run: npm init -y >/dev/null && npm install --no-audit --no-fund playwright@${{ matrix.playwright }}
        working-directory: ${{ runner.temp }}
      - name: Download the browser (4 minute limit)
        working-directory: ${{ runner.temp }}
        run: timeout 240 npx playwright install chromium
