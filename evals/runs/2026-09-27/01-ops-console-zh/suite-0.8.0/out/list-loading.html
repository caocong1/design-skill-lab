<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单列表 · 恒川设备云</title>
<style>/* 恒川设备云 · tokens */
:root {
  --ink: #1B2330;
  --ink-2: #465163;
  --ink-3: #5F6979;
  --line: #E1E5EB;
  --line-2: #ECEEF2;
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --accent: #1E5BB8;
  --accent-bg: #EEF4FF;
  --accent-line: #BCD0F0;
  --danger: #B3261E;
  --danger-bg: #FDECEA;
  --warn: #8A5300;
  --warn-bg: #FFF3DC;
  --ok: #1B6E3A;
  --ok-bg: #E7F4EC;
  --violet: #5B3E96;
  --violet-bg: #F2EEFA;
  --orange: #9C3D0A;
  --orange-bg: #FFF0E5;
  --slate-bg: #EEF1F5;
  --nav-bg: #1A2230;
  --nav-ink: #C8D0DB;
  --nav-ink-2: #8E99A8;
  --nav-active: #2A3546;
  --r-sm: 4px;
  --r: 6px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  font-synthesis-style: none;
  -webkit-font-smoothing: antialiased;
  line-break: strict;
}
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
a { color: var(--accent); text-decoration: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: 184px 1fr; min-height: 100vh; }
.nav { background: var(--nav-bg); color: var(--nav-ink); padding: 0 0 24px; }
.brand { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; color: #fff; font-weight: 600; font-size: 15px; border-bottom: 1px solid #263041; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav > ul { padding: 12px 10px; }
.nav li > a, .nav li > span { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r); color: var(--nav-ink); font-size: 13px; }
.nav li > span { color: #fff; }
.nav .sub a { padding-left: 36px; height: 34px; }
.nav .sub a.on { background: var(--nav-active); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #6FA0EC; }
.nav .grp-caret { margin-left: auto; color: var(--nav-ink-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.org { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-weight: 500; color: var(--ink); }
.org .i { color: var(--ink-3); }
.search { display: flex; align-items: center; gap: 8px; width: 320px; height: 32px; padding: 0 10px; background: var(--bg); border: 1px solid transparent; border-radius: var(--r); color: var(--ink-3); }
.search kbd { margin-left: auto; font: 12px var(--font); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: #fff; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.clock { color: var(--ink-3); }
.bell { position: relative; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink-2); background: none; border: 0; }
.bell .badge { position: absolute; top: 1px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; font-weight: 600; text-align: center; }
.user { display: flex; align-items: center; gap: 8px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: #DDE6F5; color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.user small { color: var(--ink-3); font-size: 12px; }

.page { padding: 16px 20px 28px; }
.crumb { color: var(--ink-3); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.crumb a { color: var(--ink-3); }
.crumb b { color: var(--ink-2); font-weight: 400; }
.ph { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.ph h1 { font-size: 20px; line-height: 28px; margin: 0; font-weight: 600; }
.ph .acts { margin-left: auto; display: flex; gap: 8px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid #CDD3DC; background: var(--surface); color: var(--ink); font-size: 13px; white-space: nowrap; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.sm { height: 28px; padding: 0 10px; }
.btn.danger-text { color: var(--danger); }
.btn .i { color: currentColor; }
.btn[disabled] { color: #8A93A1; background: #F4F5F7; border-color: var(--line); cursor: not-allowed; }

/* ---------- list card ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.views { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.view { position: relative; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; color: var(--ink-2); font-size: 14px; background: none; border: 0; cursor: pointer; }
.view .ct { font-size: 12px; color: var(--ink-3); background: var(--slate-bg); border-radius: 10px; padding: 0 7px; line-height: 20px; font-variant-numeric: tabular-nums; }
.view.on { color: var(--ink); font-weight: 600; }
.view.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.view.on .ct { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.view.alarm { color: var(--danger); }
.view.alarm .ct { background: var(--danger); color: #fff; font-weight: 600; }
.view.alarm .i { color: var(--danger); }
.views .sk-ct { display: inline-block; width: 28px; height: 14px; border-radius: 7px; background: #E6E9EE; }

.filters { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #8A94A3; border-radius: var(--r); background: var(--surface); white-space: nowrap; color: var(--ink); }
.field .lb { color: var(--ink-3); }
.field .i { color: var(--ink-3); }
.field.kw { width: 232px; color: var(--ink-3); }
.field.date .ph-t { color: var(--ink-3); }
.field.set { border-color: var(--accent-line); background: var(--accent-bg); }
.field.set .lb { color: var(--ink-2); }
.field.set .val { color: var(--accent); font-weight: 600; }
.field.set .x { color: var(--accent); margin-left: 2px; }
.filters .spacer { flex: 1; }
.filters .link { color: var(--accent); background: none; border: 0; padding: 0 4px; cursor: pointer; }

.toolbar { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; }
.toolbar .meta { color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.toolbar .meta b { color: var(--ink); font-weight: 600; }
.toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.bulk { display: flex; align-items: center; gap: 10px; background: var(--accent-bg); border: 1px solid var(--accent-line); border-radius: var(--r); height: 36px; padding: 0 6px 0 12px; }
.bulk .count { font-weight: 600; color: var(--ink); }
.bulk .sep { width: 1px; height: 16px; background: var(--accent-line); }
.bulk .btn { height: 26px; }
.bulk .all { color: var(--accent); }

/* ---------- table ---------- */
table.t { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.t th, .t td { padding: 0 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t thead th { height: 38px; background: #F7F8FA; color: var(--ink-2); font-weight: 500; font-size: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.t thead th.sorted { color: var(--ink); font-weight: 600; }
.t thead th .i { vertical-align: -3px; color: var(--accent); }
.t tbody td { height: 50px; padding-top: 6px; padding-bottom: 6px; line-height: 18px; border-bottom: 1px solid var(--line-2); }
.t td.title, .t td.loc { white-space: normal; }
.t td.title { word-break: keep-all; overflow-wrap: anywhere; }
.t .nw { white-space: nowrap; }
.t .dev .code, .t .dev .type { display: block; }
.t .dev .type { font-size: 12px; color: var(--ink-2); }
.t tbody tr:last-child td { border-bottom: 0; }
.t td.cb, .t th.cb { padding: 0 0 0 14px; overflow: visible; }
.t tr.sel td { background: var(--accent-bg); border-bottom-color: #DCE6F7; }
.t tr.late td.cb { box-shadow: inset 4px 0 0 var(--danger); }
.t .id a { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; }
.t .title { color: var(--ink); font-weight: 500; }
.t .dev, .t .loc { color: var(--ink-2); }
.t .dev .code { color: var(--ink); font-variant-numeric: tabular-nums; }
.t .tm { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 12px; }
.t .tm .d, .t .tm .t { display: block; }
.t .tm .d { color: var(--ink-3); }
.t .who { color: var(--ink); }
.t .who.none { color: var(--ink-3); }
.t .ops { text-align: right; padding-right: 12px; }
.t .ops a { margin-left: 10px; }
.t .ops a.strong { font-weight: 600; }
.cbx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #7F8998; background: #fff; display: inline-grid; place-items: center; vertical-align: middle; }
.cbx.on { background: var(--accent); border-color: var(--accent); }
.cbx.on svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.4; fill: none; }
.cbx.mixed { background: var(--accent); border-color: var(--accent); }
.cbx.mixed::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }

/* badges */
.pri { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.pri b { font-weight: 700; font-variant-numeric: tabular-nums; }
.pri.p1 { background: var(--danger); color: #fff; }
.pri.p2 { background: var(--orange-bg); color: var(--orange); box-shadow: inset 0 0 0 1px #F3C9AE; }
.pri.p3 { background: var(--slate-bg); color: var(--ink-2); font-weight: 500; }
.pri.p4 { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px #D5DAE1; font-weight: 500; }
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.st svg { width: 12px; height: 12px; }
.st.s-wait { background: var(--warn-bg); color: var(--warn); }
.st.s-assigned { background: var(--slate-bg); color: var(--ink-2); }
.st.s-doing { background: var(--accent-bg); color: var(--accent); }
.st.s-hold { background: #F1F1F3; color: var(--ink-2); box-shadow: inset 0 0 0 1px #D9DCE1; }
.st.s-check { background: var(--violet-bg); color: var(--violet); }
.st.s-closed { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px #DADEE4; }
.st-note { color: var(--ink-3); font-size: 12px; margin-left: 4px; }

.sla { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.sla .i { width: 14px; height: 14px; }
.sla.normal { color: var(--ink); }
.sla.normal .i { color: var(--ink-3); }
.sla.soon { color: var(--warn); font-weight: 600; }
.sla.over { color: var(--danger); font-weight: 600; }
.sla.done { color: var(--ok); }
.sla.late { color: var(--ink-2); }
.sla.late .i { color: var(--danger); }
.sla.paused { color: var(--ink-3); }

.foot { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink-2); }
.foot .pager { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.pg { min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--r); display: grid; place-items: center; color: var(--ink-2); font-variant-numeric: tabular-nums; background: none; }
.pg.on { border-color: var(--accent); color: var(--accent); font-weight: 600; background: #fff; }
.pg[disabled] { color: #A6AEBA; }
.pg.gap { color: var(--ink-3); }
.goto { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
.goto .inp { width: 44px; height: 30px; border: 1px solid #8A94A3; border-radius: var(--r); }

/* ---------- states ---------- */
.state { padding: 56px 24px 64px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.state .glyph { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; }
.state .glyph svg { width: 24px; height: 24px; stroke-width: 1.6; }
.state h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.state p { margin: 0; color: var(--ink-2); max-width: 36em; font-size: 13px; line-height: 1.7; }
.state .acts { display: flex; gap: 8px; margin-top: 18px; }
.state .chips { display: flex; gap: 6px; margin: 10px 0 0; flex-wrap: wrap; justify-content: center; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--slate-bg); color: var(--ink); font-size: 12px; }
.chip .k { color: var(--ink-3); margin-right: 2px; }
.errbox { margin-top: 16px; display: grid; grid-template-columns: auto auto; gap: 4px 16px; text-align: left; background: #F7F8FA; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 12px; color: var(--ink-2); }
.errbox dt { color: var(--ink-3); }
.errbox dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; margin: 12px 16px 0; padding: 10px 12px; border-radius: var(--r); background: var(--danger-bg); color: var(--danger); border: 1px solid #F3C4BF; }
.banner .msg { color: var(--ink); }
.banner .btn { margin-left: auto; }

.sk { display: inline-block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #E3E7EC 0%, #F0F2F5 50%, #E3E7EC 100%); background-size: 200% 100%; animation: sk 1.4s ease-in-out infinite; vertical-align: middle; }
@keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .spin { animation: none !important; } }
.spin { animation: spin 1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-note { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.loading-note .i { color: var(--accent); }

.bulk .pg-note { font-weight: 400; color: var(--ink-2); }

.pri.p1.muted { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px #E3A9A4; }
a:focus-visible, button:focus-visible, [role="checkbox"]:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- detail ---------- */
.detail { font-size: 13px; }
.crumb-row { display: flex; align-items: center; height: 28px; margin-bottom: 8px; }
.util { margin-left: auto; display: flex; gap: 2px; }
.head { padding: 16px 20px 0; }
.head-top { display: flex; gap: 24px; align-items: flex-start; }
.head-l { min-width: 0; }
.head-id { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.src { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); background: var(--slate-bg); border-radius: 4px; padding: 0 7px; height: 22px; font-size: 12px; }
.head-t { display: flex; align-items: center; gap: 10px; margin: 6px 0 6px; }
.head-t h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; }
.head-m { color: var(--ink-2); }
.head-m b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.head-m .dot { margin: 0 8px; color: var(--ink-3); }
.head-a { margin-left: auto; display: flex; gap: 8px; flex: none; padding-top: 22px; }

.sla-row { display: grid; grid-template-columns: 1fr 1fr; margin: 16px -20px 0; border-top: 1px solid var(--line); }
.slab { padding: 14px 20px 14px; }
.slab + .slab { border-left: 1px solid var(--line); }
.slab-h { display: flex; align-items: center; gap: 8px; }
.slab-k { color: var(--ink-2); }
.slab-s { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-left: auto; height: 22px; padding: 0 8px; border-radius: 11px; }
.slab-s.ok { color: var(--ok); background: var(--ok-bg); }
.slab-s.run { color: var(--accent); background: var(--accent-bg); }
.slab-v { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 10px; }
.slab-v .big { font-size: 20px; font-weight: 600; line-height: 28px; }
.slab.met .big { color: var(--ink-2); font-size: 16px; font-weight: 500; }
.slab-v .sub { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 6px; border-radius: 3px; background: #E6E9EE; }
.bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.slab.met .bar > span { background: #2E8A4E; }
.bar > i { display: none; }
.bar > em { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--ink); font-style: normal; }
.bar > em b { position: absolute; top: -20px; left: 6px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--ink); }
.bar-lb { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.slab.run .slab-v { margin-bottom: 26px; }
.slab.met .slab-v { margin-bottom: 26px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 16px; align-items: start; }
.col-main, .col-side { display: flex; flex-direction: column; gap: 16px; }
.sec { padding: 14px 16px 16px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 28px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-meta { color: var(--ink-3); font-size: 12px; }
.sec-link { margin-left: auto; font-size: 12px; }

.rds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.rd { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; }
.rd.bad { border-color: #F0B8B2; background: #FFF8F7; box-shadow: inset 0 3px 0 var(--danger); }
.rd-k { color: var(--ink-2); font-size: 13px; }
.rd-v { font-size: 26px; font-weight: 600; line-height: 34px; margin: 4px 0 4px; }
.rd.bad .rd-v { color: var(--danger); }
.rd-v small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.rd-f { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; }
.rd-range { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag .i { width: 12px; height: 12px; }
.tag.bad { color: var(--danger); background: var(--danger-bg); }
.tag.ok { color: var(--ok); background: var(--ok-bg); }
.tag.wait { color: var(--warn); background: var(--warn-bg); }

.finding { margin: -4px 0 8px; color: var(--ink); font-size: 13px; }
.finding b { color: var(--danger); }
.chart { display: block; font-family: var(--font); }
.chart .ax { font-size: 12px; fill: #5F6979; font-variant-numeric: tabular-nums; }
.chart .ax.thr { fill: #B3261E; font-weight: 600; }
.chart .thr-lb { font-size: 12px; fill: #B3261E; font-weight: 600; }
.chart .ev { font-size: 12px; fill: #465163; }
.chart .pv { font-size: 12px; fill: #465163; font-variant-numeric: tabular-nums; }
.chart .pv.over { fill: #B3261E; }
.chart .pv.last { font-weight: 700; font-size: 13px; }

.events { list-style: none; margin: 0; padding: 0; }
.ev-i { display: grid; grid-template-columns: 44px 20px 1fr; align-items: start; position: relative; padding-bottom: 14px; }
.ev-i:last-child { padding-bottom: 0; }
.ev-i::before { content: ""; position: absolute; left: 53px; top: 16px; bottom: -2px; width: 1px; background: var(--line); }
.ev-i:last-child::before { display: none; }
.ev-t { color: var(--ink-2); line-height: 20px; }
.ev-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; margin: 6px 0 0 5px; position: relative; z-index: 1; }
.ev-dot.sys { border-color: #8E99A8; }
.ev-i.latest .ev-dot { background: var(--accent); }
.ev-h { line-height: 20px; display: flex; gap: 8px; align-items: center; }
.ev-h b { font-weight: 600; }
.ev-role { font-size: 12px; color: var(--ink-3); }
.ev-x { color: var(--ink); line-height: 1.6; margin-top: 1px; }
.photos { display: flex; gap: 10px; margin-top: 8px; }
.ph-tile { margin: 0; width: 120px; }
.ph-img { height: 76px; border-radius: var(--r); background: #F7F8FA; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-3); font-size: 12px; }
.ph-img .i { width: 22px; height: 22px; }
.ph-tile figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }

.dev-id { display: flex; align-items: baseline; gap: 8px; margin: -4px 0 10px; font-size: 15px; }
.dev-id .num { font-weight: 600; }
.dev-id span + span { color: var(--ink-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: 68px 1fr; gap: 8px 12px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); }
.warn-t { color: var(--warn); }
.muted { color: var(--ink-3); }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.people li { display: flex; gap: 10px; align-items: center; }
.people b { font-weight: 600; }
.role-tag { margin-left: 8px; font-size: 12px; color: var(--accent); background: var(--accent-bg); border-radius: 4px; padding: 1px 6px; }
.role-tag.plain { color: var(--ink-2); background: var(--slate-bg); }
.parts, .rel { list-style: none; margin: 0; padding: 0; }
.parts li { padding: 10px 0; border-top: 1px solid var(--line-2); }
.parts li:first-child { border-top: 0; padding-top: 0; }
.parts li:last-child { padding-bottom: 0; }
.pt-n { color: var(--ink); font-weight: 500; }
.pt-m { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 12px; }
.rel li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 0; border-top: 1px solid var(--line-2); }
.rel li:first-child { border-top: 0; padding-top: 0; }
.rel li:last-child { padding-bottom: 0; }
.rel a { font-size: 12px; }
.rel .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.rel-t { color: var(--ink); }
</style>
