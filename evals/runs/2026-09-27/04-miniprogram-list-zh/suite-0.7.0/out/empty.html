<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>没有结果 · 拾光到家</title>
<style>
:root {
  /* colour roles */
  --c-bg: #F3F4F2;          /* page behind cards */
  --c-surface: #FFFFFF;
  --c-fill: #F1F2F0;        /* search field, neutral chips */
  --c-line: #E3E5E2;
  --c-ink: #1B1F1E;         /* 16.9:1 on white */
  --c-ink-2: #4D5553;       /* 7.7:1 on white */
  --c-ink-3: #646C69;       /* 5.4:1 on white, 4.8:1 on fill */
  --c-brand: #0E6B63;       /* 6.4:1 on white */
  --c-brand-soft: #E4F1EE;  /* brand text on it 5.5:1 */
  --c-price: #B8360F;       /* 5.9:1 on white */
  --c-star: #D9861A;        /* icon only */
  --c-scrim: rgb(20 24 23 / 0.5);
  --c-tab-idle: #646B70;    /* 5.4:1 on white */
  /* type */
  --f-ui: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  /* space: 4 / 8 / 12 / 16 / 24 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  /* radii */
  --r-card: 12px; --r-chip: 8px; --r-pill: 999px;
  /* system frame (WeChat, 375 design width = 750 rpx) */
  --sys-status: 44px; --sys-nav: 44px; --sys-tabbar: 49px; --sys-safe: 34px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 375px; height: 812px; overflow: hidden; }
body { font-family: var(--f-ui); color: var(--c-ink); background: var(--c-bg);
  -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.4; }
.page { position: relative; width: 375px; height: 812px; display: flex; flex-direction: column; overflow: hidden; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---- system: status bar ---- */
.sys-status { flex: none; height: var(--sys-status); background: var(--c-surface); display: flex; align-items: center;
  justify-content: space-between; padding: 4px 22px 0 30px; font-size: 15px; font-weight: 600; }
.sys-status .icons { display: flex; align-items: center; gap: 6px; }

/* ---- custom navigation bar (page-owned) + capsule (WeChat-owned) ---- */
.nav { flex: none; position: relative; height: var(--sys-nav); background: var(--c-surface); display: flex; align-items: center; padding: 0 var(--s-3); }
.loc { display: flex; align-items: center; gap: 4px; height: 44px; max-width: 256px; font-size: 16px; font-weight: 600; color: var(--c-ink); }
.loc .dim { font-weight: 400; color: var(--c-ink-2); }
.capsule { position: absolute; left: 281px; top: 6px; width: 87px; height: 32px; border-radius: 16px;
  border: 0.5px solid rgb(0 0 0 / 0.14); background: rgb(255 255 255 / 0.7); display: flex; align-items: center; }
.capsule span { flex: 1; display: flex; align-items: center; justify-content: center; height: 100%; }
.capsule i { width: 0.5px; height: 18px; background: rgb(0 0 0 / 0.16); }

/* ---- header: search, categories, sort/filter ---- */
.header { flex: none; background: var(--c-surface); }
.search { margin: 2px var(--s-3) 0; height: 38px; border-radius: var(--r-pill); background: var(--c-fill);
  display: flex; align-items: center; gap: 6px; padding: 0 var(--s-3); color: var(--c-ink-3); font-size: 15px; }
.cats { position: relative; display: flex; gap: var(--s-2); padding: 10px var(--s-3) 8px; overflow: hidden; white-space: nowrap; }
.cat { flex: none; height: 32px; padding: 0 14px; border-radius: var(--r-pill); background: var(--c-fill); color: var(--c-ink-2);
  font-size: 15px; display: flex; align-items: center; }
.cat[aria-selected="true"] { background: var(--c-brand); color: #fff; font-weight: 600; }
.cats-fade { position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, rgb(255 255 255 / 0), #fff 75%); }
.sortbar { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s-3) 0 var(--s-4);
  border-top: 0.5px solid var(--c-line); border-bottom: 0.5px solid var(--c-line); font-size: 14px; color: var(--c-ink-2); }
.sortbar .opt { height: 42px; display: flex; align-items: center; }
.sortbar .opt[aria-current="true"] { color: var(--c-brand); font-weight: 600; }
.sortbar .filter { display: flex; align-items: center; gap: 4px; height: 42px; padding-left: var(--s-3); border-left: 0.5px solid var(--c-line); color: var(--c-ink); }
.sortbar .filter[data-active="true"] { color: var(--c-brand); font-weight: 600; }
.badge { min-width: 16px; height: 16px; border-radius: 8px; background: var(--c-brand); color: #fff; font-size: 11px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }

/* ---- scrolling region ---- */
.scroll { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.list { display: flex; flex-direction: column; gap: 10px; padding: 10px var(--s-3) var(--s-4); }

/* ---- ServiceCard ---- */
.card { background: var(--c-surface); border-radius: var(--r-card); padding: 12px var(--s-4) 12px; display: flex; flex-direction: column; }
.card .row { display: flex; align-items: center; }
.card .name { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .dist { flex: none; margin-left: var(--s-2); font-size: 13px; color: var(--c-ink-3); display: flex; align-items: center; gap: 2px; }
.card .meta { margin-top: 4px; gap: 6px; font-size: 13px; color: var(--c-ink-2); line-height: 18px; }
.card .meta .sep { width: 0.5px; height: 11px; background: #C9CDCA; }
.card .rating { display: flex; align-items: center; gap: 2px; color: var(--c-ink); font-weight: 600; }
.card .served { color: var(--c-ink-3); }
.tags { margin-top: var(--s-2); display: flex; gap: 6px; }
.tag { height: 22px; padding: 0 6px; border-radius: 4px; background: var(--c-fill); color: var(--c-ink-2); font-size: 12px; display: flex; align-items: center; gap: 3px; }
.tag[data-kind="guarantee"] { background: var(--c-brand-soft); color: var(--c-brand); }
.card .foot { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--c-line); justify-content: space-between; align-items: flex-end; }
.slot { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-ink-3); }
.slot b { font-size: 15px; font-weight: 600; color: var(--c-ink); }
.slot[data-day="today"] b { color: var(--c-brand); }
.slot .today { height: 22px; padding: 0 6px; border-radius: 4px; background: var(--c-brand-soft); color: var(--c-brand); font-size: 12px; font-weight: 600; display: flex; align-items: center; }
.price { display: flex; align-items: baseline; gap: 2px; color: var(--c-price); white-space: nowrap; }
.price .pre, .price .suf { font-size: 12px; color: var(--c-ink-2); }
.price .pre { margin-right: 2px; }
.price .cur { font-size: 14px; font-weight: 600; }
.price .amt { font-size: 22px; font-weight: 700; line-height: 24px; letter-spacing: -0.01em; }

/* ---- native tab bar + home indicator (drawn by WeChat) ---- */
.tabbar { flex: none; height: var(--sys-tabbar); background: #fff; border-top: 0.5px solid rgb(0 0 0 / 0.14); display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 5px; gap: 2px; font-size: 11px; color: var(--c-tab-idle); }
.tab[aria-current="page"] { color: var(--c-brand); font-weight: 600; }
.safe { flex: none; height: var(--sys-safe); background: #fff; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; }
.safe i { width: 134px; height: 5px; border-radius: 3px; background: #111; }

/* ---- FilterPanel (drops down under the sort bar, scrim over the list only) ---- */
.scrim { position: absolute; inset: 0; background: var(--c-scrim); }
.panel { position: absolute; left: 0; right: 0; top: 0; background: var(--c-surface); border-radius: 0 0 16px 16px; display: flex; flex-direction: column; }
.panel .body { padding: 12px var(--s-4) 2px; display: flex; flex-direction: column; gap: 12px; }
.group h3 { font-size: 15px; font-weight: 600; line-height: 20px; margin-bottom: 6px; display: flex; align-items: baseline; gap: 6px; }
.group h3 small { font-size: 12px; font-weight: 400; color: var(--c-ink-3); }
.opts { display: flex; gap: var(--s-2); }
.opt-chip { flex: 1; height: 34px; border-radius: var(--r-chip); background: var(--c-fill); color: var(--c-ink); font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid transparent; white-space: nowrap; }
.opt-chip[aria-pressed="true"] { background: var(--c-brand-soft); border-color: var(--c-brand); color: var(--c-brand); font-weight: 600; }
.opts.two .opt-chip { flex: none; width: calc((100% - 24px) / 4 * 2 + 8px); }
.panel .foot { padding: 10px var(--s-4) 14px; border-top: 0.5px solid var(--c-line); margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.hint { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-ink-2); }
.hint b { color: var(--c-ink); font-weight: 600; }
.btns { display: flex; gap: 10px; }
.btn { height: 44px; border-radius: 22px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; }
.btn.secondary { flex: 1; background: var(--c-surface); color: var(--c-ink); border: 1px solid #C9CDCA; }
.btn.primary { flex: 2; background: var(--c-brand); color: #fff; }
.btn.outline { flex: 1; background: var(--c-surface); color: var(--c-brand); border: 1px solid var(--c-brand); }

/* ---- active filter chips + EmptyState ---- */
.active-filters { display: flex; align-items: center; gap: var(--s-2); padding: 10px var(--s-3); background: var(--c-surface); border-bottom: 0.5px solid var(--c-line); }
.active-filters .label { font-size: 13px; color: var(--c-ink-3); margin-right: 2px; }
.af { height: 30px; padding: 0 8px 0 10px; border-radius: var(--r-pill); background: var(--c-brand-soft); color: var(--c-brand); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 22px var(--s-4) 0; }
.empty h2 { margin-top: 10px; font-size: 18px; font-weight: 600; line-height: 26px; }
.nb { display: inline-block; white-space: nowrap; }
.empty .why { margin-top: 6px; font-size: 14px; line-height: 22px; color: var(--c-ink-2); text-align: center; max-width: 300px; }
.suggest { margin-top: 18px; align-self: stretch; background: var(--c-surface); border-radius: var(--r-card); overflow: hidden; }
.suggest h3 { font-size: 14px; font-weight: 600; color: var(--c-ink-2); padding: 12px var(--s-4) 4px; }
.sg { height: 52px; display: flex; align-items: center; padding: 0 var(--s-3) 0 var(--s-4); gap: var(--s-2); }
.sg + .sg { border-top: 0.5px solid var(--c-line); }
.sg .what { flex: 1; font-size: 16px; color: var(--c-ink); }
.sg .what small { display: block; font-size: 12px; color: var(--c-ink-3); line-height: 16px; }
.sg .count { font-size: 14px; color: var(--c-brand); font-weight: 600; }
.empty .btns { margin-top: var(--s-4); align-self: stretch; }
</style></head>
