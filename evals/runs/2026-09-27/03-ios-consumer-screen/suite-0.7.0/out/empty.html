<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<title>Dogear - Today (first run)</title>
<link rel="stylesheet" href="dogear.css">
<style>
  .first { padding: 18px 18px 8px; display: flex; flex-direction: column; }
  .art { display: flex; }
  .cover.ghost { box-shadow: inset 0 0 0 1.5px #B9D6CD, inset 5px 0 0 #CFE3DD; }
  .first-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .first-actions .btn-plain { margin-top: -2px; }
  .goal0 { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .ring0 { position: relative; width: 56px; height: 56px; flex: none; }
  .ring0 svg { position: absolute; inset: 0; }
  .ring0 .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .g-text { flex: 1; min-width: 0; }
  .stepper { flex: none; display: flex; align-items: center; height: 36px; border-radius: 18px; background: var(--fill); }
  .stepper button { width: 50px; height: 44px; margin: -4px 0; background: none; display: flex; align-items: center; justify-content: center; color: var(--label); }
  .stepper i { width: 1px; height: 18px; background: #C7C7CC; }
</style>
</head>
<body>
<div class="screen" data-screen="Today" data-state="first-run">
  <!-- status bar (system) -->
  <div class="statusbar" aria-hidden="true">
    <div class="time">9:41</div>
    <div class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.6 10.4 9.1a3.4 3.4 0 0 0-4.8 0L8 11.6Z"/><path d="M8 4.7c1.9 0 3.6.7 4.9 2l1.3-1.3A8.7 8.7 0 0 0 8 2.9 8.7 8.7 0 0 0 1.8 5.4l1.3 1.3a6.9 6.9 0 0 1 4.9-2Z"/><path d="M8 0C4.9 0 2.1 1.2 0 3.2l1.2 1.3C3 2.8 5.4 1.8 8 1.8s5 1 6.8 2.7L16 3.2C13.9 1.2 11.1 0 8 0Z" transform="translate(0 -.2)"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".38"/><rect x="2" y="2" width="20" height="9" rx="2.4"/><path d="M25 4.4v4.2c.8-.3 1.4-1.1 1.4-2.1S25.8 4.7 25 4.4Z" fill-opacity=".45"/></svg>
    </div>
  </div>
  <div class="island" aria-hidden="true"></div>

  <main class="scroll">
    <div class="content">
      <div class="navrow">
        <div class="spacer"></div>
        <button class="glass glass-btn" data-component="ToolbarButton" aria-label="Add book" style="border:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <header class="largetitle">
        <h1 class="t-large">Today</h1>
        <div class="subtitle t-sub muted">Sunday, 27 September</div>
      </header>

      <!-- first step: add a book -->
      <section class="card first" data-component="FirstBookCard" data-state="first-use" style="margin-top:10px">
        <div class="art" aria-hidden="true">
          <div class="cover ghost" style="--c:#E1EEEA;--under:#fff;--f:18px;width:64px;height:92px">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--tint)" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
            <svg class="fold" viewBox="0 0 10 10"><path class="cut" d="M0 0H10V10Z"/><path d="M0 0L10 10H0Z" fill="#B9D6CD"/></svg>
          </div>
        </div>
        <h2 class="t-title2" style="margin-top:16px">Add the book you’re reading</h2>
        <p class="t-sub" style="color:var(--label-2);margin-top:6px">Dogear times your sessions, keeps your place and saves your highlights. Start with one book.</p>
        <div class="first-actions">
          <button class="btn btn-prominent" data-component="Button" data-role="primary" style="border:0">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M14 2.5h2.5a1 1 0 0 1 1 1V6M17.5 14v2.5a1 1 0 0 1-1 1H14M6 17.5H3.5a1 1 0 0 1-1-1V14"/><path d="M6 6.5v7M8.5 6.5v7M10.5 6.5v7M13.8 6.5v7" stroke-width="1.6"/></svg>
            Scan barcode
          </button>
          <button class="btn btn-gray" data-component="Button" data-role="secondary" style="border:0">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 4 4"/></svg>
            Search by title
          </button>
          <button class="btn btn-plain" data-component="Button" data-role="tertiary" style="border:0">Import from a CSV file</button>
        </div>
      </section>

      <!-- daily goal, preset and adjustable -->
      <section class="card goal0" data-component="GoalSetting" style="margin-top:14px">
        <div class="ring0" role="img" aria-label="Daily goal 20 minutes">
          <svg viewBox="0 0 92 92" width="56" height="56"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--tint-soft)" stroke-width="11"/></svg>
          <div class="in"><span class="t-head num" style="font-size:18px;line-height:20px">20</span><span class="t-cap2 muted">min</span></div>
        </div>
        <div class="g-text">
          <div class="t-head">Daily goal</div>
          <div class="t-foot muted" style="margin-top:1px">20 minutes a day. Change it anytime.</div>
        </div>
        <div class="stepper" data-component="Stepper" role="group" aria-label="Daily goal">
          <button aria-label="Decrease goal" style="border:0"><svg viewBox="0 0 20 20" width="18" height="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 10h11"/></svg></button>
          <i></i>
          <button aria-label="Increase goal" style="border:0"><svg viewBox="0 0 20 20" width="18" height="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
        </div>
      </section>
      <p class="t-foot muted" style="padding:8px 16px 0">Your streak starts with your first reading session.</p>
    </div>
  </main>

  <div class="edge-bottom" aria-hidden="true"></div>

  <!-- tab bar (system, iOS 26) -->
  <nav class="tabbar" data-component="TabBar" aria-label="Sections">
    <div class="tabs glass">
      <a class="tab" aria-current="page">
        <svg viewBox="0 0 26 26" fill="currentColor"><path d="M6.5 4h13A2.5 2.5 0 0 1 22 6.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 4 19.5v-13A2.5 2.5 0 0 1 6.5 4Z"/><rect x="5.6" y="9.2" width="14.8" height="11.2" rx="1.2" fill="#fff" fill-opacity=".92"/><rect x="8.5" y="12" width="4.2" height="4.2" rx="1" /></svg>
        Today
      </a>
      <a class="tab">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="4.5" height="17" rx="1"/><rect x="9.5" y="7.5" width="4.5" height="14" rx="1"/><path d="m15.6 8.6 4.3-1.2 3.6 13.1-4.3 1.2z"/></svg>
        Library
      </a>
      <a class="tab">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="12.5" width="4.4" height="9" rx="1"/><rect x="10.8" y="5" width="4.4" height="16.5" rx="1"/><rect x="17.6" y="9" width="4.4" height="12.5" rx="1"/></svg>
        Stats
      </a>
    </div>
    <a class="tab-search glass" aria-label="Search">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11.5" cy="11.5" r="6.8"/><path d="m16.5 16.5 5 5"/></svg>
    </a>
  </nav>

  <div class="home-indicator" aria-hidden="true"></div>
</div>
</body>
</html>
