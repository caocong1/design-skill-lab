<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<title>Dogear · Today (first run)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=block');
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:#5E5E63; --label3:#6C6C70;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.16);
  --tint:#A8431B; --tint-soft:#FBEDE6; --tint-track:#F1D9CC;
  --serif:'Newsreader', 'New York', Georgia, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:402px;height:874px;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:var(--label);
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:22px;letter-spacing:-0.41px;position:relative}
button{font:inherit;color:inherit;background:none;border:0;letter-spacing:inherit;cursor:default}

/* ---------- system chrome ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:62px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding-top:2px;pointer-events:none}
.statusbar .time{width:136px;text-align:center;font-weight:600;font-size:17px;letter-spacing:-0.4px;padding-left:6px}
.statusbar .icons{width:136px;display:flex;gap:7px;justify-content:center;align-items:center;padding-right:6px}
.home-ind{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:#000;z-index:60}

/* ---------- Liquid Glass ---------- */
.glass{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.10),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.35)}
.navrow{position:absolute;top:62px;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.circle-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--label)}
.avatar{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-weight:600;font-size:17px;color:#fff;
  background:linear-gradient(160deg,#C56A42,#8E3614);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.10)}

.tabbar{position:absolute;left:20px;top:774px;width:288px;height:62px;border-radius:31px;z-index:45;display:flex;padding:4px;gap:0}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#1C1C1E;font-size:10px;line-height:12px;font-weight:600;letter-spacing:0.1px}
.tab svg{display:block;height:28px}
.tab.on{background:rgba(0,0,0,.065);color:var(--tint)}
.searchtab{position:absolute;left:320px;top:774px;width:62px;height:62px;border-radius:31px;z-index:45;display:grid;place-items:center;color:#1C1C1E}
.scrim{position:absolute;left:0;right:0;bottom:0;height:100px;z-index:44;pointer-events:none;
  background:linear-gradient(to bottom,rgba(242,242,247,0),rgba(242,242,247,.96) 20px,#F2F2F7 28px)}

/* ---------- content ---------- */
.scroll{position:absolute;top:0;left:0;right:0;padding:114px 16px 140px}
.largetitle{font-size:34px;line-height:41px;font-weight:700;letter-spacing:0.37px;padding:0 4px}
.subtitle{font-size:15px;line-height:20px;color:var(--label2);letter-spacing:-0.24px;padding:0 4px;margin-top:1px}
.card{background:var(--card);border-radius:26px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;margin:22px 0 8px}
.sechead h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:0.35px}
.sechead a{font-size:17px;color:var(--tint);text-decoration:none}
.footnote{font-size:13px;line-height:18px;letter-spacing:-0.08px;color:var(--label2)}
.sub{font-size:15px;line-height:20px;letter-spacing:-0.24px;color:var(--label2)}
.num{font-variant-numeric:tabular-nums}

.btn-primary{height:52px;border-radius:26px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 4px 14px rgba(168,67,27,.25)}
.btn-gray{height:46px;border-radius:23px;background:rgba(120,120,128,.10);color:var(--tint);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}

.list .row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;position:relative}
.list .row + .row::before{content:"";position:absolute;top:0;right:0;height:.5px;background:var(--sep)}
.chev{color:#8E8E93;flex:none}

/* covers */
.cover{flex:none;border-radius:4px;position:relative;overflow:hidden;color:#F4EBD9;font-family:var(--serif);display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.10)}
.cover::after{content:"";position:absolute;top:0;bottom:0;left:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08) 60%,rgba(0,0,0,0))}
.c-mm{background:#2F4F3E}.c-wd{background:#2E5A73}.c-pb{background:#8C2F39}

.hero{margin-top:16px;padding:22px 20px 20px;text-align:center}
.hero h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;margin-top:16px}
.hero p{margin:6px auto 0;max-width:300px}
.hero .btn-primary{margin-top:20px}
.ways{margin-top:12px}
.ways .row{gap:14px}
.ways .ic{width:30px;height:30px;border-radius:8px;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;flex:none}
.ways .ic svg{transform:scale(.8)}
.ways .lbl{flex:1}
.ways .lbl small{display:block;font-size:13px;line-height:18px;color:var(--label2);letter-spacing:-0.08px}
.ways .row{min-height:62px}
.goalrow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 16px;min-height:64px}
.goalrow b{font-size:17px;font-weight:600}
.stepper{display:flex;align-items:center;height:36px;border-radius:18px;background:var(--fill);overflow:hidden}
.stepper button{width:47px;height:36px;display:grid;place-items:center;color:var(--label)}
.stepper .div{width:.5px;height:18px;background:rgba(60,60,67,.3)}
.help{padding:8px 20px 0}
</style></head>
<body>

<div class="statusbar" aria-hidden="true">
  <div class="time">9:41</div>
  <div class="icons">
    <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="5.1" y="5.2" width="3.2" height="6.8" rx="1"/><rect x="10.2" y="2.7" width="3.2" height="9.3" rx="1"/><rect x="15.3" y="0" width="3.2" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.3-1.3C14 1.4 11.4.3 8.5.3S3 1.4.9 3.5l1.3 1.3C3.9 3.2 6.1 2.3 8.5 2.3z"/><path d="M8.5 5.9c1.4 0 2.7.5 3.7 1.4l1.3-1.3c-1.3-1.2-3.1-2-5-2s-3.7.8-5 2l1.3 1.3c1-.9 2.3-1.4 3.7-1.4z"/><path d="M8.5 9.4l2.2-2.2c-.6-.5-1.4-.8-2.2-.8s-1.6.3-2.2.8l2.2 2.2z" transform="translate(0 1.6)"/></svg>
    <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".38"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><path d="M26 4.3v4.4c.9-.3 1.5-1.2 1.5-2.2s-.6-1.9-1.5-2.2z" fill-opacity=".45"/></svg>
  </div>
</div>

<div class="navrow"><span></span><button class="circle-btn glass" aria-label="Account"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="13" r="11"/><circle cx="13" cy="10.5" r="4"/><path d="M5.6 20.8c1.8-2.6 4.4-3.8 7.4-3.8s5.6 1.2 7.4 3.8"/></svg></button></div>
<main class="scroll">
  <h1 class="largetitle">Today</h1>
  <p class="subtitle">Sunday, 27 September</p>

  <section class="card hero">
    <svg width="112" height="92" viewBox="0 0 112 92" aria-hidden="true">
      <ellipse cx="56" cy="86" rx="40" ry="4" fill="rgba(0,0,0,.06)"/>
      <path d="M56 16 C44 9 26 8 12 11 V80 C26 77 44 78 56 85 Z" fill="#FBEDE6" stroke="#A8431B" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M56 16 C68 9 86 8 100 11 V80 C86 77 68 78 56 85 Z" fill="#FFF8F3" stroke="#A8431B" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M100 11 V28 L84 11.2 Z" fill="#A8431B"/>
      <path d="M22 28c9-1.5 18-1 26 2M22 40c9-1.5 18-1 26 2M22 52c9-1.5 18-1 26 2M22 64c6-1 12-.8 17 .8" stroke="#D9A58C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M64 30c8-2.6 14-3.1 22-2.4M64 42c9-2.6 18-3 26-2M64 54c9-2.6 18-3 26-2M64 66c9-2.6 18-3 26-2" stroke="#D9A58C" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <h2>Add your first book</h2>
    <p class="sub">Pick something you’re reading now. Your goal, timer and streak start with it.</p>
    <button class="btn-primary"><svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 5V3a1.5 1.5 0 0 1 1.5-1.5h2.5M16.5 1.5H19A1.5 1.5 0 0 1 20.5 3v2M20.5 13v2a1.5 1.5 0 0 1-1.5 1.5h-2.5M5.5 16.5H3A1.5 1.5 0 0 1 1.5 15v-2"/><path d="M6 5.5v7M9 5.5v7M12 5.5v7M15.5 5.5v7" stroke-width="1.8"/></svg><span>Scan Barcode</span></button>
  </section>

  <section class="card list ways">
    <div class="row"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg></span><span class="lbl">Search by Title</span><svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg></div>
    <div class="row"><span class="ic"><svg width="18" height="21" viewBox="0 0 18 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 1.5h8l5 5V18a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 2 18V3A1.5 1.5 0 0 1 3 1.5z"/><path d="M11 1.5v5h5M5.5 11.5h7M5.5 15h7" stroke-linecap="round"/></svg></span><span class="lbl">Import from CSV File<small>A list exported from another app</small></span><svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg></div>
  </section>

  <div class="sechead"><h2>Daily Goal</h2></div>
  <section class="card">
    <div class="goalrow">
      <div><b class="num">20 minutes</b><div class="footnote">a day · change it any time</div></div>
      <div class="stepper" role="group" aria-label="Adjust daily goal">
        <button aria-label="Decrease">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <span class="div"></span>
        <button aria-label="Increase"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12M8 2v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </section>
  </main>

<div class="scrim"></div>
<nav class="tabbar glass" aria-label="Tabs">
  <button class="tab on" aria-current="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="14" cy="14" r="9.5" stroke-opacity=".28"/><path d="M14 4.5a9.5 9.5 0 0 1 8.2 14.3"/><circle cx="14" cy="14" r="3.2" fill="currentColor" stroke="none"/></svg><span>Today</span></button>
  <button class="tab" aria-current="false"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="5" height="18" rx="1.2"/><rect x="11" y="5" width="5" height="18" rx="1.2"/><path d="M18.2 7.3l4.1-1.1 4.3 16.1-4.1 1.1z" transform="translate(-2 0)"/></svg><span>Library</span></button>
  <button class="tab" aria-current="false"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 22V15M11.3 22V9M16.6 22v-9M21.9 22V6"/></svg><span>Stats</span></button>
</nav>
<button class="searchtab glass" aria-label="Search"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2l5.8 5.8"/></svg></button>
<div class="home-ind" aria-hidden="true"></div>
</body></html>
