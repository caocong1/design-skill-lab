<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1, viewport-fit=cover">
<title>Today – Dogear</title>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --label: #000000;
  --label2: #5E5E63;
  --sep: rgba(60, 60, 67, 0.20);
  --fill: rgba(118, 118, 128, 0.12);
  --accent: #A8401F;
  --accent-track: rgba(168, 64, 31, 0.16);
  --accent-soft: #F7E9E3;
  --serif: "New York", ui-serif, "Iowan Old Style", Georgia, serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 402px; height: 874px; overflow: hidden;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.41px;
}
button { font: inherit; color: inherit; border: 0; background: none; letter-spacing: inherit; cursor: pointer; }

.screen { position: relative; width: 402px; height: 874px; overflow: hidden; }
.scroll {
  position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
  padding: 62px 0 140px;
}
.scroll::-webkit-scrollbar { display: none; }

/* ---------- Status bar ---------- */
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 62px; z-index: 50;
  pointer-events: none;
}
.statusbar .time {
  position: absolute; left: 0; width: 140px; top: 19px; text-align: center;
  font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 22px;
}
.statusbar .island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 37px; border-radius: 19px; background: #000;
}
.statusbar .right {
  position: absolute; right: 0; width: 140px; top: 19px; height: 22px;
  display: flex; align-items: center; justify-content: center; gap: 6px; padding-left: 8px;
}

/* ---------- Home indicator ---------- */
.home-indicator {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 139px; height: 5px; border-radius: 3px; background: #000; z-index: 60;
}

/* ---------- Liquid glass ---------- */
.glass {
  background: rgba(255, 255, 255, 0.80);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  backdrop-filter: blur(18px) saturate(180%);
  box-shadow:
    0 0 0 0.5px rgba(0, 0, 0, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -1px 1px rgba(255, 255, 255, 0.5),
    0 8px 24px rgba(0, 0, 0, 0.10),
    0 1px 3px rgba(0, 0, 0, 0.06);
}
.glass-btn {
  width: 44px; height: 44px; border-radius: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--label);
}
.glass-btn svg { width: 20px; height: 20px; }

/* Top nav bar row (44pt under status bar) */
.navbar {
  position: absolute; top: 62px; left: 0; right: 0; height: 52px; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
}
.navbar .spacer { flex: 1; }
.navbar .group { display: flex; gap: 8px; }

/* Large title */
.largetitle { padding: 52px 20px 0; }
.largetitle h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px; }
.largetitle .sub { font-size: 15px; line-height: 20px; color: var(--label2); letter-spacing: -0.24px; margin-top: 1px; }

/* ---------- Tab bar (iOS 26 floating) ---------- */
.tabbar-fade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 106px; z-index: 30; pointer-events: none;
  background: linear-gradient(to bottom, rgba(242,242,247,0) 0px, rgba(242,242,247,0.9) 8px, #F2F2F7 14px);
}
.tabbar {
  position: absolute; left: 20px; right: 20px; bottom: 38px; height: 62px; z-index: 45;
  display: flex; gap: 12px;
}
.tabbar .tabs {
  flex: 1; height: 62px; border-radius: 31px; padding: 4px;
  display: flex; align-items: stretch;
}
.tabbar .tab {
  flex: 1; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: #1C1C1E; font-size: 10px; font-weight: 600; letter-spacing: 0.1px;
}
.tabbar .tab svg { width: 26px; height: 24px; }
.tabbar .tab.selected { background: rgba(118, 118, 128, 0.14); color: var(--accent); }
.tabbar .search {
  width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; color: #1C1C1E;
}
.tabbar .search svg { width: 24px; height: 24px; }

/* ---------- Content primitives ---------- */
.section { padding: 0 16px; margin-top: 24px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 10px;
}
.section-head h2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.35px; }
.section-head .link { font-size: 17px; color: var(--accent); }
.card { background: var(--card); border-radius: 26px; }
.list { background: var(--card); border-radius: 26px; overflow: hidden; }
.row { display: flex; align-items: center; min-height: 52px; padding: 0 20px; position: relative; }
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 20px; right: 0; height: 0.5px; background: var(--sep);
}
.chev { width: 8px; height: 14px; color: #8E8E93; flex: none; margin-left: 10px; }

.btn {
  height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 17px; font-weight: 600;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 8px rgba(168,64,31,0.25); }
.btn-gray { background: var(--fill); color: var(--accent); }

.progress { height: 6px; border-radius: 3px; background: rgba(118,118,128,0.16); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

/* Book covers (designed placeholders) */
.cover {
  position: relative; flex: none; border-radius: 4px 6px 6px 4px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
  font-family: var(--serif); color: #F4EBDD;
  box-shadow: 0 1px 2px rgba(0,0,0,0.18), 0 6px 14px rgba(0,0,0,0.14);
}
.cover::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7%;
  background: linear-gradient(to right, rgba(0,0,0,0.28), rgba(255,255,255,0.10) 70%, rgba(0,0,0,0));
}
.cover .rule { width: 60%; height: 1px; background: currentColor; opacity: 0.55; }
.c-middlemarch { background: #2E4B3B; }
.c-walden { background: #33526B; }
.c-pillow { background: #7B2F3C; }


.welcome { padding: 22px 20px 14px; text-align: center; }
.welcome .art { width: 116px; height: 92px; margin: 0 auto 14px; display: block; }
.welcome h2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.35px; }
.welcome p { font-size: 17px; line-height: 23px; color: var(--label2); margin: 8px 8px 0; }
.welcome .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.welcome .btn-gray { height: 52px; }
.welcome .plain { height: 44px; font-size: 17px; font-weight: 600; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 2px; }
.welcome .plain svg { width: 18px; height: 18px; }

.goal-row { display: flex; align-items: center; min-height: 64px; padding: 0 16px 0 20px; }
.goal-row .l { flex: 1; }
.goal-row .t { font-size: 17px; line-height: 22px; }
.goal-row .v { font-size: 15px; line-height: 20px; color: var(--label2); letter-spacing: -0.24px; }
.goal-row .v b { font-weight: 600; color: var(--label); }
.stepper { display: flex; align-items: center; height: 36px; border-radius: 18px; background: var(--fill); }
.stepper button { width: 52px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--label); }
.stepper button svg { width: 16px; height: 16px; }
.stepper i { width: 1px; height: 18px; background: rgba(60,60,67,.25); }
.footnote { font-size: 13px; line-height: 18px; color: var(--label2); padding: 8px 20px 0; letter-spacing: -0.08px; }

</style>
</head>
<body>


<div class="screen">
  
<div class="statusbar" aria-hidden="true">
  <div class="time">9:41</div>
  <div class="island"></div>
  <div class="right">
    <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="5.1" y="5" width="3.2" height="7" rx="1"/><rect x="10.2" y="2.5" width="3.2" height="9.5" rx="1"/><rect x="15.3" y="0" width="3.2" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C14 1.7 11.4.6 8.5.6S3 1.7 1.1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3z"/><path d="M8.5 5.7c1.5 0 2.8.6 3.8 1.5l1.2-1.2C12.2 4.7 10.4 4 8.5 4S4.8 4.7 3.5 6l1.2 1.2c1-.9 2.3-1.5 3.8-1.5z"/><path d="M8.5 9.1c.6 0 1.1.2 1.5.6L8.5 11.4 7 9.7c.4-.4.9-.6 1.5-.6z"/></svg>
    <svg width="28" height="13" viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="24" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><path d="M26 4.3v4.4c.9-.3 1.5-1.2 1.5-2.2s-.6-1.9-1.5-2.2z" fill-opacity=".4"/></svg>
  </div>
</div>

  <main class="scroll">
    <header class="largetitle">
      <h1>Today</h1>
      <p class="sub">Sunday, 27 September</p>
    </header>

    <section class="section" style="margin-top:18px">
      <div class="card welcome">
        <svg class="art" viewBox="0 0 132 104" aria-hidden="true">
          <ellipse cx="66" cy="98" rx="52" ry="4" fill="rgba(0,0,0,.06)"/>
          <!-- back book -->
          <rect x="30" y="14" width="56" height="78" rx="4" fill="#33526B"/>
          <!-- front book with a dog-eared corner -->
          <path d="M48 20h46a4 4 0 0 1 4 4v54l-14 14H48a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="#2E4B3B"/>
          <path d="M98 78L84 92V82a4 4 0 0 1 4-4z" fill="#8FA89A"/>
          <rect x="44" y="20" width="5" height="72" rx="2" fill="rgba(0,0,0,.22)"/>
          <rect x="58" y="36" width="28" height="3" rx="1.5" fill="#F4EBDD" opacity=".85"/>
          <rect x="62" y="44" width="20" height="2" rx="1" fill="#F4EBDD" opacity=".55"/>
          <!-- plus badge -->
          <circle cx="104" cy="24" r="15" fill="#A8401F"/>
          <path d="M104 17v14M97 24h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <h2>Add Your First Book</h2>
        <p>Start with the book you’re reading now, paper or e‑book.</p>
        <div class="stack">
          <button class="btn btn-primary">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.8 5.5V3.3c0-.8.7-1.5 1.5-1.5h2.2M12.5 1.8h2.2c.8 0 1.5.7 1.5 1.5v2.2M16.2 12.5v2.2c0 .8-.7 1.5-1.5 1.5h-2.2M5.5 16.2H3.3c-.8 0-1.5-.7-1.5-1.5v-2.2"/><path d="M5 5.5v7M7.5 5.5v7M10 5.5v7M13 5.5v7" stroke-width="1.6"/></svg>
            Scan Barcode
          </button>
          <button class="btn btn-gray">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.8" cy="7.8" r="5.3"/><path d="M11.8 11.8l4 4"/></svg>
            Search by Title
          </button>
          <button class="plain">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 1.8H4.5c-.8 0-1.5.7-1.5 1.5v11.4c0 .8.7 1.5 1.5 1.5h9c.8 0 1.5-.7 1.5-1.5V6.3z"/><path d="M10.5 1.8v4.5H15"/><path d="M9 8.5v5M6.8 11.3L9 13.5l2.2-2.2"/></svg>
            Import from CSV File
          </button>
        </div>
      </div>
    </section>

    <section class="section" style="margin-top:20px">
      <div class="section-head"><h2>Daily Goal</h2></div>
      <div class="list">
        <div class="goal-row">
          <div class="l">
            <div class="t"><b style="font-family:var(--rounded);font-size:22px;font-weight:700;letter-spacing:0">20</b> minutes a day</div>
          </div>
          <div class="stepper" role="group" aria-label="Adjust daily goal">
            <button aria-label="Decrease goal"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
            <i></i>
            <button aria-label="Increase goal"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
          </div>
        </div>
      </div>
      <p class="footnote">You can change your goal anytime.</p>
    </section>
  </main>

  
<div class="tabbar-fade" aria-hidden="true"></div>
<nav class="tabbar" aria-label="Tabs">
  <div class="tabs glass" role="tablist">
    <button class="tab selected" role="tab" aria-selected="true"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="13" cy="12" r="9" stroke-opacity=".28"/><path d="M13 3a9 9 0 0 1 8.2 12.7"/><circle cx="13" cy="12" r="2.8" fill="currentColor" stroke="none"/></svg><span>Today</span></button>
    <button class="tab" role="tab" aria-selected="false"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3.5" width="5" height="17" rx="1.2"/><rect x="10" y="3.5" width="5" height="17" rx="1.2"/><path d="M17.2 5.6l3.9-1.1 3.4 15.4-3.9 1.1z"/><path d="M3 7.5h5M10 7.5h5" /></svg><span>Library</span></button>
    <button class="tab" role="tab" aria-selected="false"><svg viewBox="0 0 26 24" fill="currentColor"><rect x="4" y="12" width="4.2" height="9" rx="1.4"/><rect x="10.9" y="4" width="4.2" height="17" rx="1.4"/><rect x="17.8" y="8.5" width="4.2" height="12.5" rx="1.4"/></svg><span>Stats</span></button>
  </div>
  <button class="search glass" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.8"/><path d="M15.6 15.6l5 5"/></svg></button>
</nav>
  <div class="home-indicator" aria-hidden="true"></div>
</div>

</body>
</html>
