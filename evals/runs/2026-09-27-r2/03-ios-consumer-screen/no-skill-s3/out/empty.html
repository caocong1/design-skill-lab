<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<title>Dogear · Today (first run)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:402px;height:874px;overflow:hidden;background:#F2F2F7}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;color:#000;
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:22px;letter-spacing:-.43px}
button{font:inherit;color:inherit;border:0;background:none;letter-spacing:inherit;cursor:pointer}
:root{--accent:#B03A0B;--accent-tint:#FBEFE7;--label:#000;--sec:#636366;--sep:rgba(60,60,67,.18);--fill:#E9E9EE;--bg:#F2F2F7}
.screen{position:relative;width:402px;height:874px;overflow:hidden;background:var(--bg)}
.content{position:absolute;inset:0;padding:62px 16px 140px}

/* status bar */
.status{position:absolute;left:0;right:0;top:0;height:62px;z-index:50;pointer-events:none}
.status .time{position:absolute;left:0;width:128px;top:19px;text-align:center;font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.4px}
.status .island{position:absolute;left:138px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.status .right{position:absolute;right:26px;top:23px;display:flex;gap:6px;align-items:center;height:13px}
.home-ind{position:absolute;left:131.5px;bottom:8px;width:139px;height:5px;border-radius:3px;background:#000;z-index:50}

/* toolbar (navigation bar buttons row) */
.navrow{height:54px;display:flex;align-items:center;justify-content:space-between;padding-top:4px}
.navrow .sp{flex:1}
.glass{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.95)}
.circle{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#000}
.pillgroup{height:44px;border-radius:22px;display:flex;align-items:center}
.pillgroup .circle{background:none;box-shadow:none}

.overline{font-size:13px;line-height:18px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:-.08px;padding:8px 4px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between;padding-right:0}
.largetitle{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px;padding:2px 4px 0}
.subtitle{font-size:15px;line-height:20px;color:var(--sec);letter-spacing:-.23px;padding:0 4px;font-weight:500}

.card{background:#fff;border-radius:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;margin:18px 0 8px}
.sechead h2{font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.45px}
.sechead a{font-size:15px;color:var(--accent);letter-spacing:-.23px;text-decoration:none}

.btn{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;width:100%}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(176,58,11,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.tinted{background:var(--accent-tint);color:var(--accent)}
.btn.gray{background:var(--fill);color:#000}

.foot{font-size:13px;line-height:18px;color:var(--sec);letter-spacing:-.08px}
.bar{height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* covers */
.cover{position:relative;flex:none;border-radius:4px 6px 6px 4px;overflow:hidden;color:#F6EEDC;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.10);font-family:"Iowan Old Style","Palatino",Georgia,serif;letter-spacing:0}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(0,0,0,.18)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 30%)}
.cover .rule{position:absolute;left:14%;right:10%;height:1px;background:currentColor;opacity:.55}
.cover .t{position:absolute;left:12%;right:8%;text-align:center}

/* tab bar */
.edgefade{position:absolute;left:0;right:0;bottom:0;height:112px;z-index:30;pointer-events:none;
  background:linear-gradient(180deg,rgba(242,242,247,0) 0%,rgba(242,242,247,.8) 22%,#F2F2F7 45%)}
.tabbar{position:absolute;left:21px;right:21px;bottom:38px;height:62px;display:flex;gap:10px;z-index:40}
.tabs{flex:1;border-radius:31px;display:flex;align-items:center;padding:4px}
.tab{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10px;line-height:12px;font-weight:600;letter-spacing:.1px;color:#1C1C1E}
.tab svg{display:block}
.tab.sel{background:rgba(120,120,128,.14);color:var(--accent)}
.searchtab{width:62px;height:62px;border-radius:31px;display:grid;place-items:center;color:#1C1C1E}

.hero{margin-top:12px;padding:18px 18px 18px;text-align:center}
.hero .art{display:flex;justify-content:center;margin-bottom:8px}
.hero .step{display:inline-block;font-size:13px;line-height:18px;font-weight:600;color:var(--accent);letter-spacing:-.08px;margin-bottom:4px}
.hero h2{font-size:24px;line-height:30px;font-weight:700;letter-spacing:.07px}
.hero p{font-size:16px;line-height:22px;color:var(--sec);letter-spacing:-.31px;margin:6px 6px 0}
.hero .btns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.hero .btn{gap:9px}
.hero .btn.gray{height:50px;border-radius:25px}
.goalcard{overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px 8px 16px}
.grow .lab{flex:1}
.grow .lab b{display:block;font-size:17px;font-weight:600}
.grow .lab span{display:block;font-size:15px;line-height:20px;color:var(--sec);letter-spacing:-.23px}
.stepper{display:flex;align-items:center;height:34px;border-radius:17px;background:#E9E9EE}
.stepper button{width:46px;height:34px;display:grid;place-items:center;color:#000}
.stepper i{width:1px;height:18px;background:rgba(60,60,67,.3)}
.goalfoot{padding:8px 20px 0}
</style></head>
<body><div class="screen">

<main class="content">
  <div class="overline">Sunday, 27 September</div>
  <div class="titlerow"><h1 class="largetitle">Today</h1><button class="circle glass" aria-label="Add book"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M10 3v14M3 10h14"/></svg></button></div>

  <section class="card hero">
    <div class="art"><svg width="112" height="84" viewBox="0 0 112 84" aria-hidden="true">
  <ellipse cx="56" cy="78" rx="44" ry="4" fill="#000" opacity=".06"/>
  <path d="M56 18C44 10 28 8 12 10v58c16-2 32 0 44 8z" fill="#FBEFE7" stroke="#B03A0B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M56 18c12-8 28-10 44-8v58c-16-2-32 0-44 8z" fill="#fff" stroke="#B03A0B" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M100 10v14L86 10z" fill="#B03A0B"/>
  <path d="M22 26c9-1 18 0 26 4M22 36c9-1 18 0 26 4M22 46c9-1 18 0 26 4M64 30c8-4 17-5 26-4M64 40c8-4 17-5 26-4M64 50c8-4 17-5 26-4" stroke="#B03A0B" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M56 18v58" stroke="#B03A0B" stroke-width="2.4"/>
</svg></div>
    <div class="step">Step 1 of 2</div>
    <h2>Add the book you’re reading</h2>
    <p>Then start a session. A few minutes a day builds your streak.</p>
    <div class="btns">
      <button class="btn primary"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 6.5V4a2 2 0 0 1 2-2h2.5M15.5 2H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M6.5 20H4a2 2 0 0 1-2-2v-2.5"/><path d="M6.5 7v8M9.5 7v8M12.5 7v8M15.5 7v8" stroke-width="1.8"/></svg>Scan Barcode</button>
      <button class="btn gray"><svg width="20" height="20" viewBox="0 0 26 26" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.2"/><path d="M16.4 16.4l6 6"/></svg>Search by Title</button>
      <button class="btn gray"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#000" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M12 1.5H4.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7z"/><path d="M12 1.5V7h5.5M6.5 12h7M6.5 15.5h7"/></svg>Import from CSV File</button>
    </div>
  </section>

  <div class="sechead"><h2>Daily Goal</h2></div>
  <section class="card goalcard">
    <div class="grow">
      <div class="lab"><b>20 minutes a day</b><span>Preset for you</span></div>
      <div class="stepper" role="group" aria-label="Adjust daily goal">
        <button aria-label="Decrease goal"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg></button><i></i>
        <button aria-label="Increase goal"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12M8 2v12" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </section>
  <div class="foot goalfoot">Your streak, sessions and highlights will appear here once you’ve read.</div>
</main>

<div class="edgefade" aria-hidden="true"></div>
<nav class="tabbar" aria-label="Tabs">
  <div class="tabs glass">
    <button class="tab sel"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="14" cy="14" r="10" stroke-opacity=".3"/><path d="M14 4a10 10 0 0 1 9.5 13.1"/><path d="M14 9.5v4.5l3 2"/></svg><span>Today</span></button>
    <button class="tab"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="5" height="18" rx="1.2"/><rect x="11" y="5" width="5" height="18" rx="1.2"/><path d="M18.2 7.1l4.6-1.3 4 16.8-4.6 1.2z" transform="translate(-2 0)"/></svg><span>Library</span></button>
    <button class="tab"><svg width="28" height="28" viewBox="0 0 28 28" fill="currentColor"><rect x="4.5" y="14" width="4.5" height="9" rx="1.4"/><rect x="11.75" y="8" width="4.5" height="15" rx="1.4"/><rect x="19" y="4.5" width="4.5" height="18.5" rx="1.4"/></svg><span>Stats</span></button>
  </div>
  <button class="searchtab glass" aria-label="Search"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.2"/><path d="M16.4 16.4l6 6"/></svg></button>
</nav>


<div class="status" aria-hidden="true">
  <div class="time">9:41</div>
  <div class="island"></div>
  <div class="right">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1" fill="#000"/><rect x="4.9" y="5" width="3.2" height="7" rx="1" fill="#000"/><rect x="9.8" y="2.5" width="3.2" height="9.5" rx="1" fill="#000"/><rect x="14.7" y="0" width="3.2" height="12" rx="1" fill="#000"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3z" fill="#000"/><path d="M8.5 5.8c1.4 0 2.8.5 3.8 1.5l1.2-1.2C12.2 4.8 10.4 4 8.5 4S4.8 4.8 3.5 6.1l1.2 1.2c1-1 2.4-1.5 3.8-1.5z" fill="#000"/><path d="M8.5 9.2c.5 0 1 .2 1.3.5L8.5 11 7.2 9.7c.3-.3.8-.5 1.3-.5z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".38"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="#000"/><path d="M25 4.4v4.2c.8-.3 1.4-1.1 1.4-2.1s-.6-1.8-1.4-2.1z" fill="#000" fill-opacity=".4"/></svg>
  </div>
</div>
<div class="home-ind" aria-hidden="true"></div>
</div></body></html>
