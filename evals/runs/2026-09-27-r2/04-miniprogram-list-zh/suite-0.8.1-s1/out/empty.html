<style>
:root {

  --color-bg: #f0f1ef;
  --color-surface: #ffffff;
  --color-sunken: #f0f1ef;
  --color-line: #e3e6e2;
  --color-line-strong: #c9cec8;
  --color-ink: #1b1f1d;
  --color-ink-2: #4c5450;
  --color-ink-3: #636b67;
  --color-primary: #0a6e61;
  --color-primary-ink: #075248;
  --color-primary-tint: #e4f2ee;
  --color-on-primary: #ffffff;
  --color-star: #b36b00;
  --color-scrim: rgb(20 26 24 / 0.5);
  /* system chrome (drawn by WeChat / iOS) */
  --sys-status-h: 44px;
  --sys-nav-row-h: 44px;
  --sys-tab-h: 49px;
  --sys-safe-bottom: 34px;
  --sys-tab-bg: #f7f7f7;
  --sys-tab-ink: #5c5c5c;
  /* capsule, as read from wx.getMenuButtonBoundingClientRect() at runtime */
  --cap-left: 281px; --cap-top: 50px; --cap-w: 87px; --cap-h: 32px;
  /* spacing, radius, type */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --margin: 16px;
  --fs-s: 12px; --lh-s: 18px; --fs-m: 14px; --lh-m: 20px; --fs-l: 17px; --lh-l: 24px; --fs-xl: 20px; --lh-xl: 26px;
  --r-s: 6px; --r-m: 10px; --r-l: 14px; --r-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 375px; height: 812px; overflow: hidden; background: var(--color-bg); }
body { font-family: var(--font); color: var(--color-ink); font-size: var(--fs-m); line-height: var(--lh-m); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* scaffold: bars are siblings of the one scrolling region */
.screen { position: relative; width: 375px; height: 812px; display: flex; flex-direction: column; overflow: hidden; }
.top { flex: none; background: var(--color-surface); position: relative; z-index: 3; }
.scroll { flex: 1; min-height: 0; overflow: hidden; position: relative; }

/* system: status bar */
.status { height: var(--sys-status-h); display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 30px; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
.status .sys-icons { display: flex; gap: 6px; align-items: center; }

/* custom navigation row: centred on the capsule (bar = 44 + 32 + 2 x 6 = 88) */
.nav { height: var(--sys-nav-row-h); display: flex; align-items: center; padding: 0 var(--margin); padding-right: calc(375px - var(--cap-left) + 8px); }
.loc { display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: var(--fs-l); line-height: var(--lh-l); font-weight: 600; min-width: 0; white-space: nowrap; }
.loc .dim-group { display: flex; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.loc .keep { flex: none; }
.loc .i { width: 18px; height: 18px; color: var(--color-primary); }

.loc .chev { width: 14px; height: 14px; color: var(--color-ink-2); stroke-width: 2; }
.capsule { position: absolute; left: var(--cap-left); top: var(--cap-top); width: var(--cap-w); height: var(--cap-h); border-radius: 16px;
  background: rgb(255 255 255 / 0.7); box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.16); display: flex; align-items: center; color: #000; }
.capsule span { flex: 1; display: flex; justify-content: center; align-items: center; height: 100%; }
.capsule span + span { box-shadow: inset 0.5px 0 0 rgb(0 0 0 / 0.16); }
.capsule svg { fill: currentColor; }

/* search */
.search { padding: 1px var(--margin) 5px; }
.search-hit { width: 100%; height: 44px; display: flex; align-items: center; }
.search-field { width: 100%; min-height: 38px; border-radius: var(--r-pill); background: var(--color-sunken); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--color-ink-3); font-size: var(--fs-m); white-space: nowrap; }
.search-field .i { width: 18px; height: 18px; color: var(--color-ink-2); }

/* category tabs */
.cats { position: relative; min-height: 44px; display: flex; align-items: stretch; }
.cats-track { flex: 1; min-width: 0; display: flex; gap: 18px; padding: 0 var(--margin); overflow: hidden; white-space: nowrap; }
.cat { position: relative; display: flex; align-items: center; justify-content: center; min-width: 44px; font-size: var(--fs-m); color: var(--color-ink-2); flex: none; min-height: 44px; white-space: nowrap; }
.cat[aria-selected="true"] { color: var(--color-ink); font-weight: 600; }
.cat[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 20px; height: 3px; margin-left: -10px; border-radius: 2px; background: var(--color-primary); }
.cats-fade { position: absolute; right: 44px; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, rgb(255 255 255 / 0), #fff); pointer-events: none; }
.cats-more { flex: none; width: 44px; display: flex; align-items: center; justify-content: center; color: var(--color-ink-2); background: #fff; box-shadow: -0.5px 0 0 var(--color-line); margin: 10px 0; height: 24px; align-self: center; }
.cats-more-hit { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }

/* sort + filter bar */
.sortbar { min-height: 44px; display: flex; align-items: stretch; padding: 0 var(--margin); box-shadow: inset 0 -0.5px 0 var(--color-line), inset 0 0.5px 0 var(--color-line); }
.sorts { flex: 1; display: flex; justify-content: space-between; padding-right: 14px; }
.sort { display: flex; align-items: center; gap: 2px; font-size: var(--fs-m); color: var(--color-ink-2); min-height: 44px; white-space: nowrap; }
.sort[aria-pressed="true"] { color: var(--color-primary); font-weight: 600; }
.sort .i { width: 12px; height: 12px; stroke-width: 2.2; }
.filter-btn { display: flex; align-items: center; gap: 4px; padding-left: 14px; font-size: var(--fs-m); white-space: nowrap; color: var(--color-ink-2); box-shadow: inset 0.5px 0 0 var(--color-line); margin: 0; min-height: 44px; }
.filter-btn .i { width: 16px; height: 16px; }
.filter-btn[data-active] { color: var(--color-primary); font-weight: 600; }
.filter-btn .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--color-primary); color: var(--color-on-primary); font-size: 12px; line-height: 18px; font-weight: 600; text-align: center; }

/* list */
.list-head { display: flex; align-items: center; min-height: 34px; padding: 0 var(--margin); font-size: var(--fs-s); line-height: var(--lh-s); color: var(--color-ink-3); }
.list-head .col-time { width: 68px; text-align: center; }
.list-head .col-rest { padding-left: 12px; flex: 1; display: flex; justify-content: space-between; }
.list { background: var(--color-surface); list-style: none; }
.row { display: flex; gap: 12px; padding: 14px var(--margin) 14px; position: relative; }

.when { flex: none; min-width: 68px; align-self: flex-start; border-radius: var(--r-m); background: var(--color-sunken); padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.when .day { font-size: var(--fs-s); line-height: var(--lh-s); white-space: nowrap; padding: 0 4px; color: var(--color-ink-2); }

.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.meta { display: flex; align-items: center; gap: 6px; font-size: var(--fs-m); line-height: var(--lh-m); color: var(--color-ink-3); white-space: nowrap; }

.tag[data-kind="guarantee"] { color: var(--color-primary-ink); box-shadow: inset 0 0 0 0.5px #9fcdc3; background: var(--color-primary-tint); }
.tag svg { width: 12px; height: 12px; stroke-width: 2; }

/* system: native tab bar + home indicator */
.tabbar { flex: none; height: calc(var(--sys-tab-h) + var(--sys-safe-bottom)); padding-bottom: var(--sys-safe-bottom); background: var(--sys-tab-bg); box-shadow: inset 0 0.5px 0 rgb(0 0 0 / 0.15); display: flex; position: relative; z-index: 5; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 14px; color: var(--sys-tab-ink); }

.tab[aria-current] { color: var(--color-primary); }
.home-ind { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #000; }

/* filter panel (drops from the sort bar; the native tab bar stays on top of the page) */
.scrim { position: absolute; inset: 0; background: var(--color-scrim); z-index: 1; }

.group h3 { font-size: var(--fs-m); line-height: 20px; font-weight: 600; color: var(--color-ink); margin-bottom: 4px; display: flex; justify-content: space-between; }
.group h3 small { font-size: var(--fs-s); font-weight: 400; color: var(--color-ink-3); }
.chips { display: flex; gap: 8px; }
.chip { flex: 1 1 0; min-width: 0; min-height: 44px; border-radius: var(--r-m); background: var(--color-sunken); font-size: var(--fs-m); color: var(--color-ink); display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; text-align: center; }
.chip[aria-checked="true"] { background: var(--color-primary-tint); color: var(--color-primary-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--color-primary); }
.chip .i { width: 14px; height: 14px; }
.chips.two .chip { flex: 0 0 calc((100% - 24px) / 4 * 2 + 8px); }
.panel-foot { flex: none; padding: 0 var(--margin) 10px; box-shadow: inset 0 0.5px 0 var(--color-line); display: flex; flex-direction: column; gap: 2px; }
.zero-hint { display: flex; flex-direction: column; gap: 0; }
.relax .why { color: var(--color-ink-2); font-weight: 400; }
.relax { display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: var(--fs-m); line-height: var(--lh-m); color: var(--color-primary-ink); font-weight: 600; }
.relax .grow { flex: 1; }
.relax .i { width: 16px; height: 16px; stroke-width: 2; }
.btns { display: flex; gap: 10px; }
.btn { min-height: 44px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; font-size: var(--fs-l); font-weight: 600; padding: 0 16px; white-space: nowrap; }
.btn-secondary { flex: 0 0 112px; background: var(--color-sunken); color: var(--color-ink); }
.btn-primary { flex: 1; background: var(--color-primary); color: var(--color-on-primary); }

/* empty (no results) */

.empty { padding: 22px var(--margin) 0; display: flex; flex-direction: column; }
.empty-hero { display: flex; gap: 14px; align-items: flex-start; }
.empty-hero .mark { flex: none; width: 52px; height: 52px; border-radius: 26px; background: var(--color-surface); display: flex; align-items: center; justify-content: center; color: var(--color-ink-3); box-shadow: inset 0 0 0 0.5px var(--color-line); }

.empty-hero p { font-size: var(--fs-m); line-height: 22px; color: var(--color-ink-2); margin-top: 4px; }
.empty-hero p b { color: var(--color-ink); font-weight: 600; }
.suggest-title { margin: 20px 0 8px; font-size: var(--fs-s); line-height: var(--lh-s); color: var(--color-ink-3); }
.suggest { list-style: none; background: var(--color-surface); border-radius: var(--r-l); overflow: hidden; }
.sg { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px 8px 12px; position: relative; }
.sg + .sg::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 0.5px; background: var(--color-line); }
.sg .what { flex: 1; min-width: 0; font-size: var(--fs-l); line-height: var(--lh-l); }
.sg .when { min-width: 0; width: 52px; padding: 6px 0; }
.sg .when .t { font-size: var(--fs-m); line-height: var(--lh-m); white-space: nowrap; }
.sg .what small { display: block; font-size: var(--fs-s); line-height: 18px; color: var(--color-ink-3); }
.sg .n { font-size: var(--fs-m); font-weight: 600; color: var(--color-primary-ink); white-space: nowrap; }
.sg .chev { width: 16px; height: 16px; color: var(--color-ink-3); stroke-width: 2; }
.empty .btns { margin-top: 16px; }
</style>
