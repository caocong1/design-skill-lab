<section class="sl-dom" aria-labelledby="sl-web"><h2 id="sl-web">网站设计 <small lang="en">Websites</small> <span class="num">59</span></h2>
<h3>精选网站画廊 <small lang="en">Curated site galleries</small></h3><ol>
<li id="r-siteinspire"><a href="https://www.siteinspire.com" lang="en">Siteinspire</a> <b>S</b> 克制耐看的网站画廊（2008 年起 1 万+ 站），偏字体与编辑排版；另有免登录的只读 MCP，智能体可直接检索。 <small lang="en">siteinspire.com</small></li>
<li id="r-a1-gallery"><a href="https://a1.gallery" lang="en">A1 Gallery</a> <b>S</b> 标签齐全的当代网站画廊，每站拆成内页与区块并附实测配色、字体与间距；另有 MCP 供智能体取结构化数据。 <small lang="en">a1.gallery</small></li>
<li id="r-recent-design"><a href="https://recent.design" lang="en">Recent Design</a> <b>S</b> 每日人工策展的灵感站，Godly 的继承者；除分类网站外还收 OG 图、应用商店截图、应用图标，并有按安装量排的设计 skills 榜。 <small lang="en">recent.design</small></li>
<li id="r-minimal-gallery"><a href="https://minimal.gallery" lang="en">Minimal Gallery</a> 极简网站灵感库，专收留白、字体主导的安静页面；找低饱和、排版驱动的参考时按分类筛选。 <small lang="en">minimal.gallery</small></li>
<li id="r-httpster"><a href="https://httpster.net" lang="en">Httpster</a> 收录风格各异、有性格的网站画廊，专门对冲 SaaS 同质化；想跳出模板感时按类型翻找。 <small lang="en">httpster.net</small></li>
<li id="r-hoverstates"><a href="https://www.hoverstat.es" lang="en">Hover States</a> 收录以交互为创意的实验性网站画廊，先看录屏短片筛选，再打开原站体验真实行为。 <small lang="en">hoverstat.es</small></li>
<li id="r-klikkentheke"><a href="https://klikkentheke.com" lang="en">Klikkentheke</a> 收录平面设计师自己做、给同行看的网站，字体驱动、反模板；brief 要编辑感或艺术学院气质时翻它。 <small lang="en">klikkentheke.com</small></li>
<li id="r-curated-design"><a href="https://www.curated.design" lang="en">Curated Design</a> 分类齐整的网站画廊，全页截图规格统一；适合按类目快速横向扫一遍找方向。 <small lang="en">curated.design</small></li>
<li id="r-seesaw"><a href="https://www.seesaw.website" lang="en">Seesaw</a> 更新快的新站收录，标签细到风格、字体和框架；想找用某种字体的真实网站时来这里筛。 <small lang="en">seesaw.website</small></li>
<li id="r-bestwebsite-gallery"><a href="https://bestwebsite.gallery" lang="en">Best Website Gallery</a> 一位策展人长期维护的优质网站选集，可按颜色和标签筛选；找特定色调或门类的参考时用。 <small lang="en">bestwebsite.gallery</small></li>
<li id="r-maxibestof"><a href="https://maxibestof.one" lang="en">Maxibestof</a> 偏工作室与作品集的网站库，另拆出区块库（数百个 hero、页脚、功能区）与在用字体库；查单一区块或字体搭配时用。 <small lang="en">maxibestof.one</small></li>
<li id="r-siiimple"><a href="https://siiimple.com" lang="en">Siiimple</a> <em>更新放缓</em> 极简主义网站档案馆，按分类浏览；找简约风格时当 Minimal Gallery 之外的第二来源用。 <small lang="en">siiimple.com</small></li>
<li id="r-webdesignmuseum"><a href="https://www.webdesignmuseum.org" lang="en">Web Design Museum</a> 1991–2006 年网页设计史档案馆，可按年份或站点时间线浏览；做复古、Y2K 或早期互联网美学时来取证。 <small lang="en">webdesignmuseum.org</small></li>
<li id="r-whimsical-club"><a href="https://whimsical.club" lang="en">The Whimsical Web</a> 收录有趣、有个性的个人小站；想给产品加点“人味”和惊喜时挑一个有趣的交互来学，别照搬整站。 <small lang="en">whimsical.club</small></li>
</ol>
<h3>落地页与 SaaS 官网 <small lang="en">Landing pages and SaaS marketing</small></h3><ol>
<li id="r-onepagelove"><a href="https://onepagelove.com" lang="en">One Page Love</a> <b>S</b> 2008 年起人工精选的单页站与落地页（9000+），每站有整页截图、点评和体裁、风格、平台、字体、区块标签；另有免费免密钥 MCP。 <small lang="en">onepagelove.com</small></li>
<li id="r-land-book"><a href="https://land-book.com" lang="en">Land-book</a> 筛选最细、每日更新的落地页画廊，另有从入选站点裁出的区块库（hero、定价、FAQ、CTA、页脚）；做营销页时的主力参考。 <small lang="en">land-book.com</small></li>
<li id="r-lapa-ninja"><a href="https://www.lapa.ninja" lang="en">Lapa Ninja</a> 落地页截图库，整页长图能看出区块顺序；按行业和配色分组，写 landing page 结构前先翻。 <small lang="en">lapa.ninja</small></li>
<li id="r-saaslandingpage"><a href="https://saaslandingpage.com" lang="en">SaaS Landing Page</a> 只收 SaaS 落地页的图库，可按定价、功能、关于等页面类型筛选，横向对比同类页面的做法。 <small lang="en">saaslandingpage.com</small></li>
<li id="r-saaspo"><a href="https://saaspo.com" lang="en">Saaspo</a> SaaS 站点库，按页面、区块类型与风格索引；写 hero、定价、页脚时直接查对应区块。 <small lang="en">saaspo.com</small></li>
<li id="r-landingfolio"><a href="https://www.landingfolio.com" lang="en">Landingfolio</a> 落地页灵感库，可按 hero、定价、FAQ、CTA 等组件拆开对比；灵感页免费，模板付费。 <small lang="en">landingfolio.com</small></li>
<li id="r-landing-love"><a href="https://www.landing.love" lang="en">Landing Love</a> 专收动效出色的落地页，以视频录屏展示；滚动与加载编排是关键时来这里看。 <small lang="en">landing.love</small></li>
<li id="r-lp-archive-jp"><a href="https://rdlp.jp/lp-archive" lang="ja">LP Archive (LPアーカイブ)</a> 4.6 万+ 日本长落地页（LP），每日更新，可按行业、颜色、调性筛；研究日式竖长营销页，但别原样搬给欧美用户。 <small lang="en">rdlp.jp</small></li>
</ol>
<h3>版块与元素画廊 <small lang="en">Section and element galleries</small></h3><ol>
<li id="r-reallygoodemails"><a href="https://reallygoodemails.com" lang="en">Really Good Emails</a> <b>S</b> 邮件设计的标杆参考，按场景分类且每封附 HTML 源码；做 onboarding、收据、newsletter 邮件时查它。 <small lang="en">reallygoodemails.com</small></li>
<li id="r-navbar-gallery"><a href="https://navbar.gallery" lang="en">Navbar Gallery</a> 只收导航：导航栏、超级菜单、下拉、侧边栏和移动端菜单；链接多又带 CTA 时来这里对照。 <small lang="en">navbar.gallery</small></li>
<li id="r-supahero"><a href="https://supahero.io" lang="en">Supahero</a> 只收 Hero 首屏的专门库；定首屏策略（产品图、大字排版、视频、交互）之前先扫一遍。 <small lang="en">supahero.io</small></li>
<li id="r-bentogrids"><a href="https://bentogrids.com" lang="en">Bento Grids</a> 真实网站的 bento 网格布局合集，风潮已过；确定要用时再参考它的模块尺寸与节奏。 <small lang="en">bentogrids.com</small></li>
<li id="r-footer-design"><a href="https://www.footer.design" lang="en">Footer</a> 只收页脚的灵感站，看导航结构、法律信息、newsletter 与收尾大字排版的做法。 <small lang="en">footer.design</small></li>
<li id="r-cta-gallery"><a href="https://www.cta.gallery" lang="en">CTA Gallery</a> 真实网站的 CTA 区块与按钮合集；打磨收尾段时对照别人的构图和文案写法。 <small lang="en">cta.gallery</small></li>
<li id="r-pricingpages"><a href="https://pricingpages.design" lang="en">Pricing Pages</a> 定价页与方案表的专项画廊；对比方案数量、推荐方案的强调手法和切换开关的样式。 <small lang="en">pricingpages.design</small></li>
<li id="r-404s-design"><a href="https://www.404s.design" lang="en">404s</a> 404 页面合集，错误页和空状态是品牌语气露脸的地方；找文案调性和插画路子时刷一遍。 <small lang="en">404s.design</small></li>
<li id="r-emaillove"><a href="https://emaillove.com" lang="en">Email Love</a> 按类型与品牌标签整理的邮件设计精选库；做邮件模板时翻，Really Good Emails 之外的第二来源。 <small lang="en">emaillove.com</small></li>
<li id="r-unsection"><a href="https://www.unsection.com" lang="en">Unsection</a> 按区块分类的网站画廊（首屏、功能、定价、FAQ、页脚等，5000+ 站）；只纠结某一个区块时横向对比十个同类解法。 <small lang="en">unsection.com</small></li>
</ol>
<h3>细分与地区画廊 <small lang="en">Niche and regional galleries</small></h3><ol>
<li id="r-sankoudesign"><a href="https://sankoudesign.com" lang="en">SANKOU!</a> <b>S</b> 日本网站画廊，行业、页面、颜色、版式筛选很细；做中文排版时最接近的高质量参照。 <small lang="en">sankoudesign.com</small></li>
<li id="r-darkmodedesign"><a href="https://www.darkmodedesign.com" lang="en">Dark Mode Design</a> 只收深色主题网站，研究暗色界面的表面层级与克制的强调色；要打开原站读真实色值。 <small lang="en">darkmodedesign.com</small></li>
<li id="r-brutalistwebsites"><a href="https://brutalistwebsites.com" lang="en">Brutalist Websites</a> <em>更新放缓</em> 粗野主义网站档案，附设计师短访谈；要做生糙、反精致的方向时来这里找参照。 <small lang="en">brutalistwebsites.com</small></li>
<li id="r-commercecream"><a href="https://commercecream.com" lang="en">Commerce Cream</a> 好看电商店面的画廊，多为 Shopify；用来研究真实约束下的商品页与购物车模式。 <small lang="en">commercecream.com</small></li>
<li id="r-ecomm-design"><a href="https://ecomm.design" lang="en">Ecomm.design</a> 电商网站灵感库，可按平台、品类和技术栈筛选；做时尚、食品、美妆等垂直电商时按类目翻。 <small lang="en">ecomm.design</small></li>
<li id="r-bestfolios"><a href="https://www.bestfolios.com" lang="en">Bestfolios</a> 设计师作品集、案例研究与简历的精选库；搭作品集结构、学案例叙事时参考。 <small lang="en">bestfolios.com</small></li>
<li id="r-personalsites"><a href="https://personalsit.es" lang="en">personalsit.es</a> 个人网站目录，全是不商业、有个性的排版与布局；想找非商业版式灵感时随手翻。 <small lang="en">personalsit.es</small></li>

<section class="sl-dom" aria-labelledby="sl-dataviz"><h2 id="sl-dataviz">数据可视化 <small lang="en">Data visualisation</small> <span class="num">46</span></h2>
<h3>图表选择与设计指引 <small lang="en">Chart choice and design guides</small></h3><ol>
<li id="r-ft-visual-vocabulary"><a href="https://ft-interactive.github.io/visual-vocabulary/" lang="en">FT Visual Vocabulary</a> <b>S</b> FT 的图表选择器，按数据里的关系（偏差、相关、排名、分布、随时间变化等）分类；先定关系再选图。 <small lang="en">ft-interactive.github.io</small></li>
<li id="r-data-to-viz"><a href="https://www.data-to-viz.com" lang="en">From Data to Viz</a> <b>S</b> 从数据类型到图表的决策树，附常见错误清单；定稿任何图表前先读它的 Caveats 页。 <small lang="en">data-to-viz.com</small></li>
<li id="r-urban-dataviz-guide"><a href="https://urbaninstitute.github.io/graphics-styleguide/" lang="en">Urban Institute Data Visualization Style Guide</a> <b>S</b> <em>更新放缓</em> 最完整的公开图表风格指南：带色值的配色、字体层级、标注与逐类图表规则，全部在一个静态页面上。 <small lang="en">urbaninstitute.github.io</small></li>
<li id="r-datavizproject"><a href="https://datavizproject.com" lang="en">Data Viz Project</a> 图表类型大目录，可按功能、输入和形状筛选；想找不那么俗套的图表形式时用它。 <small lang="en">datavizproject.com</small></li>
<li id="r-carbon-dataviz"><a href="https://carbondesignsystem.com/data-visualization/getting-started/" lang="en">Carbon data visualization</a> IBM Carbon 的企业图表规范：配色板、坐标轴、图例、仪表盘与无障碍规则，做后台图表照它执行。 <small lang="en">carbondesignsystem.com</small></li>
<li id="r-material-2-dataviz"><a href="https://m2.material.io/design/communication/data-visualization.html" lang="en">Material 2 data visualization</a> <em>已归档</em> Material 2 的数据可视化指南，图表选型、样式、行为与仪表盘布局讲得最清楚的入门之一。 <small lang="en">m2.material.io</small></li>
<li id="r-chartability"><a href="https://chartability.fizz.studio" lang="en">Chartability</a> 数据可视化的无障碍审计启发式清单；任何承载关键信息的图表都该过一遍。 <small lang="en">chartability.fizz.studio</small></li>
<li id="r-datawrapper-blog"><a href="https://www.datawrapper.de/blog" lang="en">Datawrapper blog and Academy</a> Datawrapper 团队的博客与 Academy：图表设计实操，数据配色系列最值得读，Academy 按图表类型讲惯例，也可直接用它的免费工具快速试图。 <small lang="en">datawrapper.de</small></li>
<li id="r-visual-display-quantitative"><a href="https://www.edwardtufte.com/book/the-visual-display-of-quantitative-information/" lang="en">The Visual Display of Quantitative Information</a> Tufte 的量化信息视觉呈现，讲数据墨水比、chartjunk 与图形诚信；做任何图表仪表盘的原理书。 <small lang="en">edwardtufte.com</small></li>
<li id="r-storytelling-with-data"><a href="https://www.storytellingwithdata.com/books" lang="en">Storytelling with Data</a> 讲商业图表设计与数据叙事的实用书；给管理层做汇报和仪表盘时读，付费。 <small lang="en">storytellingwithdata.com</small></li>
<li id="r-ons-dataviz"><a href="https://service-manual.ons.gov.uk/data-visualisation" lang="en">ONS data visualisation guidance</a> 英国国家统计局的图表、表格与配色指南：选图、无障碍配色、标题与标注；面向公众的统计数据，清晰和可访问优先于新奇。 <small lang="en">service-manual.ons.gov.uk</small></li>
<li id="r-dataviz-catalogue"><a href="https://datavizcatalogue.com" lang="en">The Data Visualisation Catalogue</a> 按功能（比较、分布、占比、关系）检索的图表类型目录，每种图附结构说明、适用场景与工具；与 FT Visual Vocabulary 搭配找不常见的图表。 <small lang="en">datavizcatalogue.com</small></li>
<li id="r-fundamentals-of-dataviz"><a href="https://clauswilke.com/dataviz/" lang="en">Fundamentals of Data Visualization</a> Claus Wilke 的完整在线免费书：选图、配色与常见陷阱、比例墨水原则、点重叠与图形设计；设计图表前先读配色与陷阱章节。 <small lang="en">clauswilke.com</small></li>
</ol>
<h3>图表库 <small lang="en">Chart libraries</small></h3><ol>
<li id="r-echarts"><a href="https://echarts.apache.org" lang="en">Apache ECharts</a> <b>S</b> 功能全的图表库，中文仪表盘与大屏项目的事实主力；定义一次主题对象，别逐图改样式；Apache-2.0。 <small lang="en">echarts.apache.org</small></li>
<li id="r-vega-lite"><a href="https://vega.github.io/vega-lite/" lang="en">Vega-Lite</a> <b>S</b> 声明式 JSON 交互图表语法，附公开的 JSON Schema；agent 可以把图表当数据输出并在渲染前校验。 <small lang="en">vega.github.io</small></li>
<li id="r-antv"><a href="https://antv.antgroup.com" lang="en">AntV</a> 蚂蚁集团的可视化技术栈与数据图形设计原则；先读设计原则，再翻 G2、G6、L7 的图表示例，MIT。 <small lang="en">antv.antgroup.com</small></li>
<li id="r-tremor"><a href="https://tremor.so" lang="en">Tremor</a> <em>更新放缓</em> 面向仪表盘与图表的 React 组件库，搭分析类界面很快；默认样式记得重塑，Apache-2.0。 <small lang="en">tremor.so</small></li>
<li id="r-d3"><a href="https://d3js.org" lang="en">D3</a> 定制数据可视化的底层工具箱；标准图表交给 Observable Plot，非标定制才上 D3；ISC。 <small lang="en">d3js.org</small></li>
<li id="r-observable-plot"><a href="https://observablehq.com/plot/" lang="en">Observable Plot</a> D3 团队出品的图形语法图表库（mark、scale、facet），默认值出色；探索性和编辑型图表首选，D3 太底层时用它。 <small lang="en">observablehq.com</small></li>
<li id="r-visx"><a href="https://visx.airbnb.tech" lang="en">visx</a> Airbnb 基于 D3 的底层 React 可视化原语（比例尺、图形、坐标轴、提示框）；需要与设计系统完全一致的定制 React 图表时用。 <small lang="en">visx.airbnb.tech</small></li>
<li id="r-visactor"><a href="https://www.visactor.io" lang="en">VisActor</a> 字节跳动可视化方案：VChart（叙事图表）、VTable（超大表格）、VMind（AI 生成图表），带 Semi、Arco 主题；已用 Semi/Arco 的项目首选。 <small lang="en">visactor.io</small></li>
<li id="r-chartjs"><a href="https://www.chartjs.org" lang="en">Chart.js</a> 简单、与框架无关的 Canvas 图表库（八种基础图表），默认值好、插件多；任何技术栈里做少量标准图表时用。 <small lang="en">chartjs.org</small></li>
<li id="r-recharts"><a href="https://recharts.github.io" lang="en">Recharts</a> 基于 SVG 的可组合 React 图表组件，也是 shadcn/ui 图表的底层，因此是大多数 AI 生成仪表盘的默认；注意 v3 有破坏性变更。 <small lang="en">recharts.github.io</small></li>
<li id="r-highcharts"><a href="https://www.highcharts.com" lang="en">Highcharts</a> 成熟的商业图表库，内置无障碍模块最完善（键盘、声音化、读屏描述），另有股票、地图、甘特图产品；商用必须购买授权。 <small lang="en">highcharts.com</small></li>
</ol>

<section class="sl-dom" aria-labelledby="sl-ai"><h2 id="sl-ai">AI 设计 <small lang="en">AI design</small> <span class="num">56</span></h2>

<section class="sl-dom" aria-labelledby="sl-a11y"><h2 id="sl-a11y">无障碍 <small lang="en">Accessibility</small> <span class="num">26</span></h2>
<h3>标准与法规 <small lang="en">Standards and law</small></h3><ol>
<li id="r-wcag-quickref"><a href="https://www.w3.org/WAI/WCAG22/quickref/" lang="en">WCAG 2.2 Quick Reference</a> <b>S</b> 可按等级筛选的 WCAG 2.2 全部成功准则与技法速查；做无障碍评审时引用准则编号说话。 <small lang="en">w3.org</small></li>

<li id="r-china-age-friendly-a11y"><a href="http://wza.isc.org.cn">China Internet age-friendly and accessibility platform (适老化及无障碍公共服务平台)</a> 工信部适老化通用设计规范（网站与 APP）、相关标准（GB/T 37668、T/ISC 0007-2021）与认证的官方平台；面向国内用户的产品上线前必查。 <small lang="en">wza.isc.org.cn</small></li>
<li id="r-eaa-en-301-549"><a href="https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/disability/european-accessibility-act-eaa_en" lang="en">European Accessibility Act and EN 301 549</a> 欧盟《无障碍法案》（2025-06-28 起适用于电商、银行、电子书、交通票务等）与其协调标准 EN 301 549（网页部分对应 WCAG 2.1 AA）。 <small lang="en">commission.europa.eu</small></li>
<li id="r-section-508"><a href="https://www.section508.gov" lang="en">Section508.gov</a> 美国联邦 ICT 无障碍官方站：修订版 508 标准（引用 WCAG 2.0 AA）、测试方法与采购指引；面向美国联邦客户时读。 <small lang="en">section508.gov</small></li>

</ol>

<li id="r-canva"><a href="https://www.canva.com" lang="en">Canva</a> 非设计师做社媒图、演示与印刷品的默认工具，带品牌套件、尺寸预设与 AI；客户要自己出物料时，把品牌套件和模板交付到这里。 <small lang="en">canva.com</small></li>

</section>
<section class="sl-dom" aria-labelledby="sl-type"><h2 id="sl-type">字体排版 <small lang="en">Typography</small> <span class="num">86</span></h2>
<h3>开源与免费字体 <small lang="en">Open and free font sources</small></h3><ol>
<li id="r-google-fonts"><a href="https://fonts.google.com" lang="en">Google Fonts</a> <b>S</b> 最大的开源字体库，有可变字体、语言筛选和 API；建议通过 Fontsource 自托管而非热链，多为 SIL OFL。 <small lang="en">fonts.google.com</small></li>
<li id="r-fontsource"><a href="https://fontsource.org" lang="en">Fontsource</a> <b>S</b> 把开源字体打包成 npm 包自托管，附 API；每个字体保留各自的开源协议。 <small lang="en">fontsource.org</small></li>

<li id="r-uncut"><a href="https://uncut.wtf" lang="en">Uncut</a> 当代免费字体目录，专收有个性的展示字体；按风格筛选，逐款核对许可，多为 OFL。 <small lang="en">uncut.wtf</small></li>
<li id="r-velvetyne"><a href="https://velvetyne.fr" lang="en">Velvetyne</a> 自由字体铸造厂，专出表现力强的实验性展示字；海报与识别要个性时用；SIL OFL。 <small lang="en">velvetyne.fr</small></li>
<li id="r-open-foundry"><a href="https://open-foundry.com" lang="en">Open Foundry</a> <em>更新放缓</em> 精选开源字体站，展示做得讲究，重质不重量；逐款字体查看各自的开源许可。 <small lang="en">open-foundry.com</small></li>
<li id="r-use-and-modify"><a href="https://usemodify.com" lang="en">Use &amp; Modify</a> 个人策展的自由字体选集，品味偏优雅与朋克；找不撞脸的开放字体来这，逐字体开源授权。 <small lang="en">usemodify.com</small></li>
<li id="r-league-of-moveable-type"><a href="https://www.theleagueofmoveabletype.com" lang="en">The League of Moveable Type</a> <em>更新放缓</em> 开源字体界的鼻祖级字厂，League Gothic、Raleway 都出自这里；想要经典可靠的免费字体时用它，SIL OFL。 <small lang="en">theleagueofmoveabletype.com</small></li>

<li id="r-free-faces"><a href="https://www.freefaces.gallery" lang="en">Free Faces</a> 免费字体策展画廊，从全网挑出品相好的；逐款确认个人使用还是可商用，许可各不同。 <small lang="en">freefaces.gallery</small></li>
<li id="r-inter"><a href="https://rsms.me/inter/" lang="en">Inter</a> UI 字体的劳模，极好也极滥；要有意识地用，发挥 tnum、cv11 等 OpenType 特性，别凭条件反射；SIL OFL。 <small lang="en">rsms.me</small></li>
<li id="r-ibm-plex"><a href="https://github.com/IBM/plex" lang="en">IBM Plex</a> IBM 的超级字族，无衬线、衬线、等宽、窄体齐全且覆盖中日韩；一套字体撑起整个产品，OFL。 <small lang="en">github.com</small></li>
<li id="r-geist-font"><a href="https://vercel.com/font" lang="en">Geist</a> Vercel 出的无衬线与等宽字体，为开发者产品设计；工具类产品里快成默认选了，SIL OFL。 <small lang="en">vercel.com</small></li>
<li id="r-monaspace"><a href="https://monaspace.githubnext.com" lang="en">Monaspace</a> GitHub 出的五声部等宽字体超族，带 texture healing 排印微调；代码密集型界面优先用它；SIL OFL。 <small lang="en">monaspace.githubnext.com</small></li>
<li id="r-atkinson-hyperlegible"><a href="https://www.brailleinstitute.org/freefont/" lang="en">Atkinson Hyperlegible</a> 盲人学院为低视力读者设计的字体，字形互不混淆；现有三版：原版、Next（2025，七个字重加可变版，支持 150+ 语言）和 Mono。无障碍优先的界面用 Next。 <small lang="en">brailleinstitute.org</small></li>

<li id="r-mona-sans"><a href="https://github.com/mona-sans" lang="en">Mona Sans and Hubot Sans</a> GitHub 开源的可变无衬线（Mona Sans 与 Hubot Sans），宽度轴跨度大；用宽度轴在同一家族里拉开标题对比，Hubot Sans 更偏技术感。 <small lang="en">github.com</small></li>
<li id="r-maple-mono"><a href="https://font.subf.dev" lang="en">Maple Mono</a> 圆润的开源等宽字体，带连字与 Nerd Font 图标；CN 版中英文严格 2:1 对齐，覆盖简繁中文与日文；代码、终端、Markdown 表格中英混排时用。 <small lang="en">font.subf.dev</small></li>
<li id="r-apple-fonts"><a href="https://developer.apple.com/fonts/" lang="en">Apple fonts (SF Pro, SF Compact, SF Mono, New York)</a> 苹果系统字体（SF Pro、SF Compact、SF Mono、New York）官方下载，做苹果平台界面稿时安装；网页请用 system-ui 字体栈，不要上传字体文件。 <small lang="en">developer.apple.com</small></li>
<li id="r-bunny-fonts"><a href="https://fonts.bunny.net" lang="en">Bunny Fonts</a> 注重隐私的 Google Fonts 镜像，CSS 接口与 Google 兼容、不记录访客；做欧盟项目又不便自托管时，把 fonts.googleapis.com 换成 fonts.bunny.net。 <small lang="en">fonts.bunny.net</small></li>
<li id="r-font-squirrel"><a href="https://www.fontsquirrel.com" lang="en">Font Squirrel</a> 精选可免费商用的字体，附老牌 Webfont Generator（子集化与格式转换）和字体识别；只转换你有嵌入授权的字体。 <small lang="en">fontsquirrel.com</small></li>

<li id="r-google-fonts-knowledge"><a href="https://fonts.google.com/knowledge" lang="en">Google Fonts Knowledge</a> Google 的字体知识库，结构化讲解选字、搭配与可变字体；查排版、可读性、OpenType 特性用它。 <small lang="en">fonts.google.com</small></li>

<li id="r-better-web-type"><a href="https://betterwebtype.com" lang="en">Better Web Type</a> <em>更新放缓</em> 面向开发者的网页排版课程与短文，篇幅短、重实操；补字体排印基本功时按课学。 <small lang="en">betterwebtype.com</small></li>
<li id="r-pimp-my-type"><a href="https://pimpmytype.com" lang="en">Pimp my Type</a> 字体评测、搭配与 UI 排印建议的博客；每周字体评测里常有判断可靠的开源字。 <small lang="en">pimpmytype.com</small></li>
<li id="r-web-is-typography"><a href="https://ia.net/topics/the-web-is-all-about-typography-period" lang="en">Web Design is 95% Typography</a> <em>已归档</em> 经典檄文，主张网页设计九成是字体排印、要把文字当界面看；读一遍校准观念。 <small lang="en">ia.net</small></li>
<li id="r-webdev-font-best-practices"><a href="https://web.dev/articles/font-best-practices" lang="en">web.dev: font best practices</a> web.dev 的字体最佳实践：加载、预载、子集化与 font-display 策略；给网页加任何字体前照做。 <small lang="en">web.dev</small></li>

<li id="r-alibaba-puhuiti"><a href="https://www.alibabafonts.com">Alibaba PuHuiTi (阿里巴巴普惠体)</a> 多字重的现代中文黑体，配西文；从官网下载以留授权记录；免费商用，不可转售字体文件。 <small lang="en">alibabafonts.com</small></li>
<li id="r-harmonyos-sans"><a href="https://developer.huawei.com/consumer/cn/design/resource/" lang="en">HarmonyOS Sans</a> 华为系统字体，覆盖简繁中文与拉丁等多文种；鸿蒙应用标配，也可当中性 UI 字体。免费商用。 <small lang="en">developer.huawei.com</small></li>
<li id="r-misans"><a href="https://hyperos.mi.com/font/" lang="en">MiSans</a> 小米的可变中文无衬线，字重范围宽；可变字重适合流动的 UI 层级；依小米协议免费商用。 <small lang="en">hyperos.mi.com</small></li>
<li id="r-smiley-sans"><a href="https://github.com/atelier-anchor/smiley-sans">Smiley Sans (得意黑)</a> 得意黑：开源的窄体斜势中文标题字，性格鲜明；只适合标题场景，OFL 协议。 <small lang="en">github.com</small></li>
<li id="r-lxgw-wenkai"><a href="https://github.com/lxgw/LxgwWenKai">LXGW WenKai (霞鹜文楷)</a> 开源楷体风格中文字体，气质温润，适合人文阅读类正文与编辑设计；SIL OFL 协议。 <small lang="en">github.com</small></li>
<li id="r-foundertype"><a href="https://www.foundertype.com">方正字库</a> 国内最大的商业字库；商用须按用途购买授权，侵权追责活跃，别存侥幸心理。 <small lang="en">foundertype.com</small></li>
<li id="r-the-type"><a href="https://www.thetype.com" lang="en">The Type</a> 中文圈最认真的字体与排印写作媒体，&#x27;孔雀计划&#x27;讲清标点宽度与间距；做中文排版必读。 <small lang="en">thetype.com</small></li>
<li id="r-heti"><a href="https://github.com/sivan/heti">赫蹏 (heti)</a> <em>更新放缓</em> 中文排版增强 CSS 库：标点挤压、中西文混排间距、阅读节奏；用在正文页上；MIT。 <small lang="en">github.com</small></li>
<li id="r-pangu-js"><a href="https://github.com/vinta/pangu.js" lang="en">pangu.js</a> 自动在中日韩与半角字符间加空格的库；能改源头文案就先改，用户生成内容靠它兜底；MIT。 <small lang="en">github.com</small></li>
<li id="r-autocorrect"><a href="https://github.com/huacnlee/autocorrect" lang="en">AutoCorrect</a> 中文文案的 lint 工具，自动处理中英文间距、标点和全半角规则；接入 CI 保持文案一致。MIT。 <small lang="en">github.com</small></li>
<li id="r-pretendard"><a href="https://github.com/orioncactus/pretendard" lang="en">Pretendard</a> 事实上的韩文界面字体：韩文基于思源黑体、拉丁字母源自 Inter，九个字重另有可变版，并有融合 M PLUS 1p 的日文版；韩文界面默认选它。 <small lang="en">github.com</small></li>
<li id="r-line-seed"><a href="https://seed.line.me/index_en.html" lang="en">LINE Seed</a> LINE 开源品牌字体家族，含日文、韩文、泰文、繁体中文与拉丁版本；适合亲和的东亚多语产品，但在日本 LINE 联想很强。 <small lang="en">seed.line.me</small></li>
<li id="r-noonnu"><a href="https://noonnu.cc" lang="ko">Noonnu (눈누)</a> 可免费商用的韩文字体目录，逐款标注授权范围；用别处找到的韩文字体前先来核对，注意印刷、网页、视频、嵌入各自的范围。 <small lang="en">noonnu.cc</small></li>
<li id="r-hanyi"><a href="https://www.hanyi.com.cn">Hanyi Fonts (汉仪字库)</a> 国内主要商业字库之一，字库庞大、维权积极；没有购买授权绝不能商用，授权范围（网页、App、视频、印刷）要和用途一致。 <small lang="en">hanyi.com.cn</small></li>
<li id="r-justfont"><a href="https://justfont.com" lang="en">justfont</a> 台湾字体公司与字体教育团队，出品金萱等繁体中文字体并提供网页字体服务；繁体中文产品选字、学中文排版都值得看。 <small lang="en">justfont.com</small></li>
<li id="r-100font"><a href="https://www.100font.com" lang="en">100font.com</a> 免费商用字体大全，以中文为主，可按简繁、日韩与风格筛选，附授权说明与下载；猫啃网之后的第二道授权核对，上线前再到厂商官网确认。 <small lang="en">100font.com</small></li>
<li id="r-hellofont"><a href="https://www.hellofont.cn">HelloFont (字由)</a> 字由：中文字体管理工具，标注授权、在设计软件里一键换字，并有 AI 字体识别；识别出结果后先核对授权再用。 <small lang="en">hellofont.cn</small></li>
<li id="r-qiuziti"><a href="https://www.qiuziti.com">Qiuziti (求字体)</a> 上传图片识别字体，支持中、英、日、韩；中文圈的 WhatTheFont。识别后去猫啃网或字厂核对授权。 <small lang="en">qiuziti.com</small></li>
<li id="r-douyin-sans"><a href="https://github.com/bytedance/fonts">Douyin Sans (抖音美好体)</a> 抖音品牌创意中心以 OFL 开源的粗体展示字体，收 6763 个汉字和 682 个数字西文符号；只用于标题与活动物料，抖音联想强。 <small lang="en">github.com</small></li>
<li id="r-sarasa-gothic"><a href="https://github.com/be5invis/Sarasa-Gothic">Sarasa Gothic (更纱黑体)</a> 更纱黑体：由 Inter、Iosevka 与思源黑体合成的中日韩字体，含 UI 与等宽样式，中英文严格 2:1 对齐；代码、表格、终端中英混排时用。 <small lang="en">github.com</small></li>
<li id="r-jlreq"><a href="https://www.w3.org/TR/jlreq/" lang="ja">Requirements for Japanese Text Layout (日本語組版処理の要件)</a> W3C 日文排版需求：断行、标点、注音（ruby）、混排与竖排；产品同时有日文和中文时与 clreq 一起查。 <small lang="en">w3.org</small></li>
<li id="r-klreq"><a href="https://www.w3.org/TR/klreq/" lang="en">Requirements for Hangul Text Layout and Typography (klreq)</a> W3C 韩文排版需求：断行与单词分割规则、行首行尾禁则、标点、字距，以及韩文与拉丁字母混排；产品上韩文时查对应规则。 <small lang="en">w3.org</small></li>
</ol>
</section>
<section class="sl-dom" aria-labelledby="sl-color"><h2 id="sl-color">色彩 <small lang="en">Colour</small> <span class="num">41</span></h2>
<h3>色板灵感 <small lang="en">Palette inspiration</small></h3><ol>
<li id="r-coolors"><a href="https://coolors.co" lang="en">Coolors</a> 快速配色生成器，可锁定单色、查对比度、逛灵感区；锁住品牌色往外生成，对比度另行验证。 <small lang="en">coolors.co</small></li>
<li id="r-realtime-colors"><a href="https://www.realtimecolors.com" lang="en">Realtime Colors</a> 在真实页面版式上预览配色与字体搭配，可导出 token；给配色方案做体检的最快办法。 <small lang="en">realtimecolors.com</small></li>
<li id="r-happy-hues"><a href="https://www.happyhues.co" lang="en">Happy Hues</a> <em>更新放缓</em> 把精选色板直接套在页面上展示并标注角色，学的是颜色分工，不只是抄色值。 <small lang="en">happyhues.co</small></li>
<li id="r-huemint"><a href="https://huemint.com" lang="en">Huemint</a> 机器学习生成配色，直接在品牌和网页样机上预览；在最接近交付物的样机上生成。 <small lang="en">huemint.com</small></li>
<li id="r-adobe-color"><a href="https://color.adobe.com" lang="en">Adobe Color</a> 配色和谐规则、从图片取色、对比度与色盲检查一体；拿参考照片提取色板。 <small lang="en">color.adobe.com</small></li>
<li id="r-color-hunt"><a href="https://colorhunt.co" lang="en">Color Hunt</a> 社区配色方案库，按人气和标签排序；当成流行趋势风向标参考，别当最终方案。 <small lang="en">colorhunt.co</small></li>
<li id="r-sanzo-wada"><a href="https://sanzo-wada.dmbk.io" lang="en">A Dictionary of Color Combinations (Sanzo Wada)</a> 和田三造 1930 年代 348 组配色组合的交互版；找不落俗套的成熟配色。 <small lang="en">sanzo-wada.dmbk.io</small></li>
<li id="r-nippon-colors"><a href="https://nipponcolors.com" lang="en">Nippon Colors</a> <em>已归档</em> 日本传统色数据库，色名与色值俱全；做东方语境配色时，从这里取有出处的颜色。 <small lang="en">nipponcolors.com</small></li>
<li id="r-zhongguose"><a href="https://zhongguose.com">中国色</a> 中国传统色网站：500 多种传统色的名称、拼音、CMYK、RGB 与十六进制值，注明依据中科院《色谱》标准；另提供 colors.json、llms.txt 与 MCP 接口。 <small lang="en">zhongguose.com</small></li>
<li id="r-poline"><a href="https://meodai.github.io/poline/" lang="en">Poline</a> 在极坐标色彩空间里锚点连线生成配色的工具；做生成式、插画感配色用；MIT。 <small lang="en">meodai.github.io</small></li>
<li id="r-brandcolors"><a href="https://brandcolors.net" lang="en">BrandColors</a> <em>更新放缓</em> 收录各品牌官方色值的档案站；用来查某个行业的用色惯例。 <small lang="en">brandcolors.net</small></li>
</ol>
<h3>色阶与系统生成 <small lang="en">Scale and system builders</small></h3><ol>
<li id="r-oklch-picker"><a href="https://oklch.com" lang="en">OKLCH Color Picker</a> <b>S</b> OKLCH 取色与转换工具，可视化 sRGB、P3、Rec2020 色域边界；建色阶前先看颜色是否超色域。MIT。 <small lang="en">oklch.com</small></li>
<li id="r-radix-colors"><a href="https://www.radix-ui.com/colors" lang="en">Radix Colors</a> <b>S</b> 十二级色阶，每级有明确 UI 用途，配暗色与透明阶；级别到角色的映射可迁移到任何配色；MIT。 <small lang="en">radix-ui.com</small></li>
<li id="r-leonardo"><a href="https://leonardocolor.io" lang="en">Leonardo</a> <b>S</b> 按目标对比度反推色阶的工具，支持自适应主题；先定对比度再得颜色，与先选再验相反，Apache-2.0。 <small lang="en">leonardocolor.io</small></li>
<li id="r-harmonizer"><a href="https://harmonizer.evilmartians.com" lang="en">Harmonizer</a> 基于 OKLCH 与 APCA 对比度的配色生成器，跨色相保持感知一致；搭整套色阶时用。 <small lang="en">harmonizer.evilmartians.com</small></li>
<li id="r-tailwind-colors"><a href="https://tailwindcss.com/docs/colors" lang="en">Tailwind CSS colors</a> 广泛使用的 11 级色阶，用 OKLCH 定义；参考其明度与彩度曲线，安全但因此常见；MIT。 <small lang="en">tailwindcss.com</small></li>
<li id="r-material-theme-builder"><a href="https://material-foundation.github.io/material-theme-builder/" lang="en">Material Theme Builder</a> 用 HCT 色调板从种子色生成一整套 Material 色彩角色，可导出 Compose、Flutter 与网页代码；Apache-2.0。 <small lang="en">material-foundation.github.io</small></li>
<li id="r-tints-dev"><a href="https://www.tints.dev" lang="en">tints.dev</a> 输入一个 hex 生成 Tailwind 式 11 级色阶，曲线可调；快速起品牌色阶，再用对比度校验。 <small lang="en">tints.dev</small></li>
<li id="r-uicolors"><a href="https://uicolors.app" lang="en">UI Colors</a> Tailwind 色阶生成器，边调色边在真实 UI 预览和对比度网格里检查；tints.dev 之外的替代。 <small lang="en">uicolors.app</small></li>
<li id="r-huetone"><a href="https://huetone.ardov.me" lang="en">Huetone</a> <em>更新放缓</em> 在 LCH 空间搭建色板，每级同步显示 WCAG 与 APCA 对比度数值；边调整套色彩系统边盯可读性，MIT。 <small lang="en">huetone.ardov.me</small></li>
<li id="r-accessible-palette"><a href="https://accessiblepalette.com" lang="en">Accessible Palette</a> 生成各色相亮度与对比度一致的色板，保证每个色相的同一阶（如 600）都过同样的对比度。 <small lang="en">accessiblepalette.com</small></li>
<li id="r-atmos"><a href="https://atmos.style" lang="en">Atmos</a> LCH 调色板构建器，带色阶曲线和对比度检查；想要更可视化的曲线编辑用它。 <small lang="en">atmos.style</small></li>
<li id="r-colorbox"><a href="https://colorbox.io" lang="en">ColorBox</a> <em>更新放缓</em> Lyft 出品的色阶生成器：用缓动曲线逐级调整色相、饱和度与明度，再导出；色阶需要手工调曲线而非套公式时用。 <small lang="en">colorbox.io</small></li>
<li id="r-reasonable-colors"><a href="https://www.reasonable.work/colors/" lang="en">Reasonable Colors</a> <em>更新放缓</em> 开源调色板，每色 6 阶，色阶号差值即保证对比度：差 2 至少 3:1，差 3 至少 4.5:1；写颜色 token 时借用「级差即对比度」的规则。 <small lang="en">reasonable.work</small></li>
<li id="r-ant-design-colors"><a href="https://ant.design/docs/spec/colors-cn" lang="en">Ant Design colour system</a> Ant Design 色彩体系：由主色按公开算法生成 10 阶基础色板、13 阶中性色与数据可视化色板；国内中后台产品最常见的色阶来源。 <small lang="en">ant.design</small></li>
<li id="r-inclusivecolors"><a href="https://www.inclusivecolors.com" lang="en">InclusiveColors</a> 一次搭好整套品牌色板，手调色相、饱和度、明度曲线，同时看哪些前景背景组合通过 WCAG 或 APCA；可导出 Tailwind、CSS、Figma、Adobe。 <small lang="en">inclusivecolors.com</small></li>
<li id="r-arco-palette"><a href="https://arco.design/palette/list" lang="en">Arco Design Palette</a> <em>更新放缓</em> 字节跳动 Arco Design 的色板工具：由一个颜色生成浅色与深色两套 10 阶色板，内置 14 组预设色；同一算法以 @arco-design/color 开源（MIT）。 <small lang="en">arco.design</small></li>
</ol>
<h3>对比度与色觉 <small lang="en">Contrast and colour vision</small></h3><ol>
<li id="r-webaim-contrast"><a href="https://webaim.org/resources/contrastchecker/" lang="en">WebAIM Contrast Checker</a> <b>S</b> WCAG 对比度速查的事实标准工具，带 API；定文字与背景色时随手核对。 <small lang="en">webaim.org</small></li>
<li id="r-who-can-use"><a href="https://www.whocanuse.com" lang="en">Who Can Use</a> 展示一对颜色在不同视觉类型下的表现；向需求方解释对比度问题时，用它把后果摆出来。 <small lang="en">whocanuse.com</small></li>
<li id="r-apca-contrast"><a href="https://apcacontrast.com" lang="en">APCA Contrast Calculator</a> APCA 明度对比度的参考计算器，带字号查表；APCA 只是草案，交付时仍要并列 WCAG 2 比值。 <small lang="en">apcacontrast.com</small></li>
<li id="r-contrast-grid"><a href="https://contrast-grid.directededges.com" lang="en">Contrast Grid</a> EightShapes 出品、现由 Directed Edges 维护的对比度矩阵：把色板里所有前景背景两两测对比度，截图贴进设计系统文档当搭配规则。 <small lang="en">contrast-grid.directededges.com</small></li>
<li id="r-color-oracle"><a href="https://colororacle.org" lang="en">Color Oracle</a> <em>更新放缓</em> 免费的色盲模拟器（Windows、Mac、Linux），实时滤镜覆盖整个屏幕，任何软件与设计稿都能查；检查状态色、图表在各类色觉下是否仍可区分。 <small lang="en">colororacle.org</small></li>
<li id="r-devtools-vision-deficiencies"><a href="https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies" lang="en">Chrome DevTools: emulate vision deficiencies</a> Chrome 自带的视觉缺陷模拟：模糊、低对比、红色盲、绿色盲、蓝色盲、全色盲，可在任何线上页面切换；智能体可经 CDP 切换并逐一截图。 <small lang="en">developer.chrome.com</small></li>
</ol>
<h3>色彩指引 <small lang="en">Colour guides</small></h3><ol>
<li id="r-oklch-article"><a href="https://evilmartians.com/chronicles/oklch-in-css-why-quit-rgb-hsl" lang="en">OKLCH in CSS: why we moved from RGB and HSL</a> <b>S</b> 讲清为什么该从 RGB、HSL 迁到 OKLCH：明度可预测、色板好生成、色域广；定色彩 token 前读。 <small lang="en">evilmartians.com</small></li>
<li id="r-stripe-accessible-colors"><a href="https://stripe.com/blog/accessible-color-systems" lang="en">Designing accessible color systems</a> <em>已归档</em> Stripe 讲如何用感知色彩空间做出对比度可预测的色板；理解色阶编号保证对比度的原理。 <small lang="en">stripe.com</small></li>
<li id="r-color-and-contrast"><a href="https://colorandcontrast.com" lang="en">Color &amp; Contrast</a> 面向 UI 设计师的交互式色彩科学指南；遇到同时对比等色彩外观效应时来查。 <small lang="en">colorandcontrast.com</small></li>
<li id="r-learnui-color"><a href="https://www.learnui.design/blog/color-in-ui-design-a-practical-framework.html" lang="en">Why Color Theory Sucks (and what framework to use instead)</a> 讲界面配色变体推导的实操文章，基于 HSB 给出深浅变化的心智模型；调状态色时参考。 <small lang="en">learnui.design</small></li>
<li id="r-refactoring-ui-color"><a href="https://www.refactoringui.com/previews/building-your-color-palette" lang="en">Building your color palette</a> Refactoring UI 的配色方法论：为什么 UI 需要灰、主色与强调色各八到十阶；产品色板的基线。 <small lang="en">refactoringui.com</small></li>
<li id="r-material-dark-theme"><a href="https://m2.material.io/design/color/dark-theme.html" lang="en">Material 2: Dark theme</a> <em>已归档</em> 对暗色表面、海拔叠层、低饱和强调色讲得最清楚的指南；推导深色模式前先读。 <small lang="en">m2.material.io</small></li>
<li id="r-hd-css-color-guide"><a href="https://developer.chrome.com/docs/css-ui/high-definition-css-color-guide" lang="en">High definition CSS color guide</a> Chrome 团队的 CSS Color 4/5 实用指南：oklch、oklab、display-p3 等新色彩空间、色域、渐变插值与 color-mix()；用 oklch 写颜色 token 前读。 <small lang="en">developer.chrome.com</small></li>
<li id="r-apple-hig-color"><a href="https://developer.apple.com/design/human-interface-guidelines/color" lang="en">Apple HIG: Color</a> 苹果的色彩规范：系统色在浅色、深色、增强对比下的取值，Liquid Glass 色彩（2025 年 12 月更新）、色彩管理与各平台差异；有官方中文版。 <small lang="en">developer.apple.com</small></li>
</ol>

<li id="r-userinterface-wiki"><a href="https://www.userinterface.wiki" lang="en">userinterface.wiki</a> Raphael Salaja 维护的界面工艺活手册：从动画原则到现代 Web API，附演示与智能体技能；实现交互细节前先读对应条目。 <small lang="en">userinterface.wiki</small></li>
